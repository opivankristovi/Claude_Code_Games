<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Katana Creed</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d1e"/>
      <stop offset="1" stop-color="#1b1430"/>
    </linearGradient>
    <radialGradient id="moon" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#e2384a"/>
      <stop offset="1" stop-color="#9e1424"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset=".55" stop-color="#d9d4ca"/>
      <stop offset="1" stop-color="#8f8b86"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#9c7426"/>
    </linearGradient>
    <pattern id="ito" width="22" height="26" patternUnits="userSpaceOnUse" y="243">
      <rect width="22" height="26" fill="#0b0b0f"/>
      <path d="M0 0L11 13L0 26M22 0L11 13L22 26" fill="none" stroke="#b81d2c" stroke-width="6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#fff" fill-opacity=".6">
      <circle cx="62" cy="58" r="2"/><circle cx="118" cy="104" r="1.5"/><circle cx="440" cy="70" r="2"/>
      <circle cx="470" cy="150" r="1.5"/><circle cx="40" cy="190" r="1.5"/><circle cx="392" cy="40" r="1.5"/>
    </g>
    <circle cx="256" cy="226" r="150" fill="url(#moon)" filter="url(#glow)"/>
    <!-- mountains and castle roofline -->
    <path d="M0 380L70 318L118 350L196 268L268 344L330 300L404 352L452 322L512 362V512H0Z" fill="#141022"/>
    <path d="M0 430L56 410H110L128 398H176L190 388H240L256 372L272 388H322L336 398H384L402 410H456L512 430V512H0Z" fill="#07060d"/>

    <!-- katana, drawn horizontally then turned -->
    <g transform="rotate(-38 256 256)" filter="url(#shadow)">
      <path d="M176 246Q350 246 474 218L486 220Q478 236 462 242Q340 270 176 266Z" fill="url(#steel)"/>
      <path d="M176 259Q340 262 466 234" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.5"/>
      <rect x="160" y="243" width="18" height="26" rx="3" fill="url(#gold)"/>
      <ellipse cx="150" cy="256" rx="11" ry="40" fill="#15121a" stroke="url(#gold)" stroke-width="5"/>
      <rect x="40" y="243" width="100" height="26" rx="6" fill="url(#ito)"/>
      <rect x="28" y="241" width="16" height="30" rx="6" fill="url(#gold)"/>
      <rect x="132" y="242" width="10" height="28" rx="3" fill="url(#gold)"/>
    </g>
  </g>
</svg>
