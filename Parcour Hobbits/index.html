<style>

<body>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<script type="module">
'use strict';
// three.js powers the 3D renderer; if it cannot load, the game falls back to the 2D renderer
let THREE = null, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment, mergeGeometries;

// =====================================================================
//  Parcour Hobbits — a remaster of the 16-bit plumber platformer saga,
//  with hobbits instead of plumbers and Truffle the pig instead of the
//  dinosaur. Six games on one engine, all art and sound made in code.
// =====================================================================
const T = 32;                       // tile size in world units
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, SC = 1, VW = 800, VH = 480;  // logical view size (world units)
const Q = { hi: true };             // graphics quality

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const TAU = Math.PI * 2;
function rng(seed) {

const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
function wpick(r, list) { // [[item, weight], ...]

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('ph_' + k)); localStorage.setItem('ph_' + k, JSON.stringify(v)); } catch (e) { return null; } }

// ---------------------------------------------------------------- Input
const Input = {
  keys: {}, cur: {}, prev: {}, touch: {}, axis: { x: 0, y: 0 }, usingTouch: false, lastPad: false,
  map: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyZ: 'jump', KeyK: 'jump', ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run', KeyJ: 'run',
    KeyC: 'alt', KeyL: 'alt', KeyE: 'alt', Escape: 'pause', KeyP: 'pause', Enter: 'confirm', Backspace: 'back', KeyQ: 'prevw', KeyR: 'nextw', Tab: 'nextw'
  },
  init() {
    addEventListener('keydown', e => {
      const b = this.map[e.code]; if (b) { this.keys[b] = true; e.preventDefault(); }
      this.usingTouch = false; Audio.init();

    addEventListener('keyup', e => { const b = this.map[e.code]; if (b) this.keys[b] = false; });

    addEventListener('touchstart', () => { if (!this.usingTouch) { this.usingTouch = true; tc.classList.remove('hidden'); } }, { passive: true });
    tc.querySelectorAll('.tb').forEach(el => {
      const b = el.dataset.b;
      const on = e => { e.preventDefault(); this.touch[b] = true; el.classList.add('on'); Audio.init(); };
      const off = e => { e.preventDefault(); this.touch[b] = false; el.classList.remove('on'); };
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
    });

    let pid = null;

      const r = pad.getBoundingClientRect(); let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dy = (e.clientY - r.top - r.height / 2) / (r.height / 2);
      const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }

    };
    pad.addEventListener('pointerdown', e => { pid = e.pointerId; pad.setPointerCapture(pid); mv(e); });
    pad.addEventListener('pointermove', e => { if (e.pointerId === pid) mv(e); });
    const up = () => { pid = null; this.axis.x = this.axis.y = 0; knob.style.left = knob.style.top = '55px'; };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);

  poll() {
    this.prev = this.cur; const c = {};

    for (const k in this.touch) if (this.touch[k]) c[k] = true;
    if (this.axis.x < -.35) c.left = true; if (this.axis.x > .35) c.right = true;
    if (this.axis.y < -.5) c.up = true; if (this.axis.y > .5) c.down = true;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];

      if (!p) continue; const B = i => p.buttons[i] && p.buttons[i].pressed;
      if (B(0)) c.jump = true; if (B(1)) c.alt = true; if (B(2) || B(3) || B(7)) c.run = true; if (B(6)) c.alt = true;
      if (B(9)) c.pause = true; if (B(8)) c.back = true; if (B(4)) c.prevw = true; if (B(5)) c.nextw = true;
      if (B(12) || p.axes[1] < -.5) c.up = true; if (B(13) || p.axes[1] > .5) c.down = true;
      if (B(14) || p.axes[0] < -.4) c.left = true; if (B(15) || p.axes[0] > .4) c.right = true;
      if (Object.keys(c).length) this.lastPad = true;

  },
  down(b) { return !!this.cur[b]; },
  hit(b) { return !!this.cur[b] && !this.prev[b]; },
  ok() { return this.hit('jump') || this.hit('confirm'); },

// ---------------------------------------------------------------- Audio
const Audio = {
  ac: null, master: null, sfxG: null, musG: null, vol: store('vol') ?? 0.8, musVol: store('musvol') ?? 0.55, song: null, timer: null,
  init() {

  setVol(v) { this.vol = v; store('vol', v); if (this.master) this.master.gain.value = v; },
  setMus(v) { this.musVol = v; store('musvol', v); if (this.musG) this.musG.gain.value = v * 0.5; },
  tone(f, d, o = {}) {

  sfx(n) {

      case 'coin': S.tone(1175, .07, { type: 'square', vol: .1, lp: 5000 }); S.tone(1760, .35, { type: 'triangle', vol: .18, delay: .06, wet: 1 }); S.tone(2349, .3, { type: 'sine', vol: .06, delay: .06 }); break;

      case 'kick': S.tone(700, .06, { type: 'square', to: 300, vol: .15 }); S.noise(.05, { f: 3000, vol: .15 }); break;
      case 'bump': S.tone(150, .1, { type: 'square', to: 90, vol: .2, lp: 900 }); break;

      case 'sprout': [392, 523, 659, 784].forEach((f, i) => S.tone(f, .12, { type: 'triangle', vol: .14, delay: i * .05 })); break;
      case 'power': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => S.tone(f, .14, { type: 'square', vol: .1, lp: 3500, delay: i * .045, wet: 1 })); break;
      case 'shrink': [880, 660, 494, 370, 277].forEach((f, i) => S.tone(f, .12, { type: 'square', vol: .1, lp: 2500, delay: i * .06 })); break;

      case 'die': [494, 466, 440, 0, 330, 311, 294, 262].forEach((f, i) => f && S.tone(f, .2, { type: 'triangle', vol: .2, delay: .3 + i * .13 })); break;
      case 'clear': [523, 659, 784, 1047, 0, 784, 1047].forEach((f, i) => f && S.tone(f, i === 6 ? .8 : .18, { type: 'square', vol: .1, lp: 3000, delay: i * .12, wet: 1 }));

    if (o && o.weed) this.ent(o.fire ? 'firesnap' : 'snapweed', x, top - 1);
  }
}

// Enemy pools per game
const POOLS = {
  smb1: w => [['mushling', 6], ['snail', 4 + w * .3], ['redsnail', w > 2 ? 2 : 0], ['para', w > 1 ? 2 : 0], ['redpara', w > 4 ? 1 : 0], ['bristle', w > 5 ? 1 : 0]],
  smb3: w => [['mushling', 5], ['snail', 4], ['redsnail', 2], ['para', 2], ['wingmush', 1.5], ['bristle', w > 2 ? 1 : 0], ['goblin', w > 3 ? .7 : 0]],
  smw: w => [['mushling', 4], ['snail', 3], ['redsnail', 2], ['dino', 4], ['para', 1], ['bristle', w > 2 ? 1 : 0]],
  smb2: w => [['hoodling', 6], ['bluehood', 3], ['hopbird', 3], ['spitbloom', w > 1 ? 1.5 : 0], ['ninj', w > 2 ? 2 : 0]],
  yi: w => [['hoodling', 6], ['greenhood', 3], ['hopbird', 2], ['prophood', w > 1 ? 1.5 : 0], ['mushling', 1]],
};
POOLS.lost = POOLS.smb1;

function enemyFor(b) { const sp = b.spec; return wpick(b.r, POOLS[sp.game](sp.world).filter(e => e[1] > 0)); }
function placeEnemy(b, type, x, y) {
  if (type === 'redsnail') b.ent('snail', x, y, { red: 1 });
  else if (type === 'para') b.ent('snail', x, y, { wing: 1 });
  else if (type === 'redpara') b.ent('snail', x, y - 3, { wing: 1, red: 1, flyY: 1 });
  else if (type === 'wingmush') b.ent('mushling', x, y, { wing: 1 });
  else if (type === 'bluehood') b.ent('hoodling', x, y, { color: '#ff6ab0', turns: 1 });
  else if (type === 'greenhood') b.ent('hoodling', x, y, { color: '#3aa84a', turns: 1 });
  else if (type === 'prophood') b.ent('hoodling', x, y - 3, { color: '#e2382a', prop: 1 });
  else b.ent(type, x, y);
}

function powerContent(b) { const g = b.spec.game; return g === 'smb2' ? 'veg' : g === 'yi' ? 'eggs' : 'power'; }
function coinContent(b) { return b.spec.game === 'yi' ? 'ystar' : 'coin'; }

// ---- chunks: each takes (b, s) with s = {x, gy} and advances s.x
const CH = {
  flat(b, s, n) {
    n = n || ri(b.r, 4, 8);
    for (let i = 0; i < n; i++) b.col(s.x + i, s.gy);
    const ne = Math.floor(b.r() * 1.6 + .55 + b.spec.diff * 1.6);
    for (let i = 0; i < ne && n > 3; i++) placeEnemy(b, enemyFor(b), s.x + 1 + ri(b.r, 0, n - 2), s.gy - 1);
    if (b.spec.game === 'smb2' && b.r() < .7) for (let i = 0; i < ri(b.r, 1, 3); i++) b.s(s.x + ri(b.r, 0, n - 1), s.gy - 1, TUFT);
    if (b.r() < .35) CH.coinArc(b, s.x + 1, s.gy - 3, Math.min(n - 2, 5));
    s.x += n;
  },
  coinArc(b, x, y, n) { for (let i = 0; i < n; i++) b.s(x + i, y - Math.round(Math.sin(i / Math.max(1, n - 1) * Math.PI) * 1.5), COIN); },
  blocks(b, s) {
    const n = ri(b.r, 8, 12); CH.flat(b, s, n); const x0 = s.x - n + 2, row = s.gy - 4;
    const pat = pick(b.r, ['B?B?B', '?', '??', 'B?BB', '?B?', 'BB?BB', '?  ?  ?']);
    for (let i = 0; i < pat.length; i++) {
      const x = x0 + i, ch = pat[i]; if (ch === ' ') continue;
      // as in the originals, the first ? block of a level holds a power-up
      if (ch === '?') { const pw = !b.firstPow || b.r() < .3 + (b.powerDebt || 0); b.firstPow = 1; b.q(x, row, pw ? (b.powerDebt = 0, powerContent(b)) : coinContent(b)); }
      else { const rr_ = b.r(); b.b(x, row, rr_ < .07 ? 'multi' : rr_ < .1 ? 'star' : rr_ < .12 ? 'oneup' : null); }
    }
    b.powerDebt = (b.powerDebt || 0) + .15;
    if (b.r() < .4 && s.gy - 8 >= 2) { const x = x0 + ri(b.r, 0, pat.length - 1); b.q(x, row - 4, b.r() < .3 ? powerContent(b) : coinContent(b)); }
    if (b.spec.pigBlock && !b.pigPlaced && b.r() < .6) { b.pigPlaced = 1; b.q(x0 + pat.length + 1, row, 'pig'); }
    else if (['smb1', 'lost', 'smb3'].includes(b.spec.game) && !b.hidden1up && b.r() < .18) { b.hidden1up = 1; b.s(x0 + pat.length + 2, row, HIDDEN); b.c[row * b.W + x0 + pat.length + 2] = 'oneup'; }
    if (b.spec.game === 'smw' && b.r() < .3) for (let i = 0; i < 3; i++) b.s(x0 + i + 6, row - 4, ROT);
  },
  pipes(b, s) {
    if (b.spec.game === 'smb2') return CH.flat(b, s);
    const k = ri(b.r, 1, 3);
    CH.flat(b, s, 2);
    for (let i = 0; i < k; i++) {
      const h = ri(b.r, 2, 4), x = s.x; b.col(x, s.gy); b.col(x + 1, s.gy);
      // some pipes can be entered with ↓ and lead to a bonus room full of coins
      const warp = !['yi', 'smb2'].includes(b.spec.game) && (b.warps || []).length < 2 && b.r() < .3;
      b.pipe(x, s.gy - h, s.gy, { weed: !warp && b.r() < .45 + b.spec.diff * .3, fire: b.spec.game === 'smb3' && b.r() < .4 });
      (b.pipes = b.pipes || []).push({ x, top: s.gy - h });
      if (warp) (b.warps = b.warps || []).push({ x, top: s.gy - h });
      s.x += 2; CH.flat(b, s, ri(b.r, 3, 6));
    }
  },
  gap(b, s) {
    if (b.spec.noGaps) return CH.flat(b, s);
    const w = ri(b.r, 2, 2 + Math.round(b.spec.diff * 2.5));
    if (b.spec.kind === 'castle' || b.spec.theme === 'lava') { for (let i = 0; i < w; i++) { b.s(s.x + i, b.H - 1, LAVA); b.s(s.x + i, b.H - 2, LAVA); } if (b.r() < .6) b.ent('ember', s.x + Math.floor(w / 2), b.H - 2); }
    if (b.spec.fish && b.r() < .6) b.ent('jumpfin', s.x, b.H);
    if (w >= 4 && b.r() < .5) { b.q(s.x + Math.floor(w / 2), s.gy - 4, coinContent(b)); }
    else if (b.r() < .5) CH.coinArc(b, s.x, s.gy - 3, w);
    s.x += w;
    CH.flat(b, s, ri(b.r, 2, 4));
  },
  stairs(b, s) {
    const h = ri(b.r, 2, 4), down = b.r() < .5, solidGap = b.r() < .45;
    for (let i = 0; i < h; i++) { b.col(s.x, s.gy); for (let y = 0; y <= i; y++) b.s(s.x, s.gy - 1 - y, HARD); s.x++; }
    b.col(s.x, s.gy); for (let y = 0; y < h; y++) b.s(s.x, s.gy - 1 - y, HARD); s.x++;
    if (solidGap && !b.spec.noGaps) s.x += ri(b.r, 1, 2);
    for (let i = h; i > 0; i--) { b.col(s.x, s.gy); for (let y = 0; y < i; y++) b.s(s.x, s.gy - 1 - y, HARD); s.x++; }
    CH.flat(b, s, 2);
    if (down) {} // stays at same height
  },
  step(b, s) {
    const d = pick(b.r, [-2, -1, 1, 2]); const ny = clamp(s.gy + d, 9, 13);
    CH.flat(b, s, 2); s.gy = ny; CH.flat(b, s, ri(b.r, 3, 6));
  },
  platforms(b, s) {
    if (b.spec.noGaps) return CH.flat(b, s);
    const w = ri(b.r, 7, 12); const x0 = s.x; let x = s.x + 1;
    if (b.spec.kind === 'castle' || b.spec.theme === 'lava') for (let i = 0; i < w; i++) { b.s(x0 + i, b.H - 1, LAVA); b.s(x0 + i, b.H - 2, LAVA); }
    while (x < x0 + w - 1) {
      const pw = ri(b.r, 2, 4), py = clamp(s.gy - ri(b.r, 0, 4), 5, 12);
      for (let i = 0; i < pw && x + i < x0 + w; i++) { b.s(x + i, py, SEMI); }
      if (TH[b.spec.theme].stem !== 'none') for (let y = py + 1; y < b.H; y++) b.s(x + Math.floor(pw / 2), y, STEM);
      if (b.r() < .4) b.s(x + 1, py - 2, COIN);
      if (b.r() < .25 + b.spec.diff * .2 && pw >= 3) placeEnemy(b, enemyFor(b), x + 1, py - 1);
      x += pw + ri(b.r, 1, 3);
    }
    if (b.spec.fish) b.ent('jumpfin', x0 + 3, b.H);
    s.x = x0 + w; CH.flat(b, s, ri(b.r, 2, 4));
  },
  lift(b, s) {
    if (b.spec.noGaps) return CH.flat(b, s);
    const w = ri(b.r, 7, 10);
    if (b.spec.kind === 'castle' || b.spec.theme === 'lava') for (let i = 0; i < w; i++) { b.s(s.x + i, b.H - 1, LAVA); b.s(s.x + i, b.H - 2, LAVA); }
    const vert = b.r() < .35;
    b.ent('lift', s.x + 1, s.gy - 1, vert ? { ax: 0, ay: 3, w: 3 } : { ax: w - 5, ay: 0, w: 3 });
    s.x += w; CH.flat(b, s, 3);
  },
  cannon(b, s) {
    const n = ri(b.r, 7, 10); CH.flat(b, s, n);
    const k = ri(b.r, 1, 2);
    for (let i = 0; i < k; i++) { const x = s.x - n + 2 + i * 4, h = ri(b.r, 1, 3); for (let y = 1; y <= h; y++) b.s(x, s.gy - y, HARD); b.ent('cannon', x, s.gy - h); }
  },
  goblin(b, s) {
    const n = 10; CH.flat(b, s, n); const x0 = s.x - n + 2;
    for (let i = 0; i < 5; i++) { b.b(x0 + i, s.gy - 4); }
    if (s.gy - 8 > 1) for (let i = 0; i < 5; i++) b.b(x0 + i + 2, s.gy - 8);
    b.ent('goblin', x0 + 2, s.gy - 1);
    if (b.r() < .5) b.ent('goblin', x0 + 4, s.gy - 5);
  },
  notes(b, s) {
    if (b.spec.noGaps) return CH.flat(b, s);
    const w = ri(b.r, 5, 8); for (let i = 0; i < w; i++) if (i % 2 === 0 || b.r() < .5) b.s(s.x + i, s.gy - ri(b.r, 0, 2), NOTE);
    if (b.r() < .5) for (let i = 0; i < w; i++) b.s(s.x + i, s.gy - 6, COIN);
    s.x += w; CH.flat(b, s, 2);
  },
  tufts(b, s) { const n = ri(b.r, 6, 10); CH.flat(b, s, n); for (let i = 0; i < n; i += 2) b.s(s.x - n + i, s.gy - 1, TUFT); },
  ladder(b, s) {
    const n = 10; CH.flat(b, s, n); const x0 = s.x - n, top = s.gy - 6;
    for (let y = top; y < s.gy; y++) b.s(x0 + 2, y, VINE);
    for (let i = 0; i < 7; i++) b.s(x0 + 3 + i, top, b.spec.game === 'smb2' ? SEMI : HARD);
    for (let i = 0; i < 3; i++) b.s(x0 + 4 + i * 2, top - 1, b.spec.game === 'smb2' ? TUFT : COIN);
    if (b.spec.game === 'smb2' && b.r() < .5) b.s(x0 + 8, top - 1, MUSHB);
    placeEnemy(b, enemyFor(b), x0 + 6, top - 1);
  },
  mushblocks(b, s) { const n = 8; CH.flat(b, s, n); const x = s.x - 5; b.s(x, s.gy - 1, MUSHB); b.s(x + 1, s.gy - 1, MUSHB); b.s(x, s.gy - 2, MUSHB); },
  coinsky(b, s) { const n = ri(b.r, 6, 10); CH.flat(b, s, n); for (let i = 0; i < n - 2; i++) b.s(s.x - n + 1 + i, s.gy - 5, COIN); },
  spring(b, s) { const n = 6; CH.flat(b, s, n); b.ent('spring', s.x - 3, s.gy - 1); for (let i = 0; i < 4; i++) b.s(s.x - 4 + i, Math.max(1, s.gy - 9), COIN); },
  // castle pieces
  firebar(b, s) {
    const n = ri(b.r, 6, 9); CH.flat(b, s, n); const x = s.x - Math.ceil(n / 2), y = s.gy - ri(b.r, 1, 4);
    b.s(x, y, USED); b.ent('firebar', x, y, { len: ri(b.r, 4, 6), spd: (b.r() < .5 ? 1 : -1) * (.035 + b.spec.diff * .02), dual: b.spec.diff > .7 && b.r() < .3 });
  },
  lavapit(b, s) {
    const w = ri(b.r, 2, 4);
    for (let i = 0; i < w; i++) { b.s(s.x + i, b.H - 1, LAVA); b.s(s.x + i, b.H - 2, LAVA); }
    b.ent('ember', s.x + Math.floor(w / 2), b.H - 2);
    s.x += w; CH.flat(b, s, ri(b.r, 2, 4));
  },
  lowceil(b, s) { const n = ri(b.r, 6, 10); CH.flat(b, s, n); for (let i = 0; i < n; i++) b.fill(s.x - n + i, 1, s.x - n + i, s.gy - 5, HARD); },
  crusher(b, s) {
    const n = 8; CH.flat(b, s, n); const x = s.x - 5;
    b.ent('crusher', x, s.gy - 5 > 2 ? 2 : 1);
  },
  bones(b, s) { const n = ri(b.r, 6, 9); CH.flat(b, s, n); b.ent('bones', s.x - 3, s.gy - 1); },
  // ghost house pieces
  wisps(b, s) { const n = ri(b.r, 7, 10); CH.flat(b, s, n); b.ent('wisp', s.x - 2, s.gy - 5); if (b.r() < .5) b.ent('wisp', s.x - 6, s.gy - 7); },
  ghostfloor(b, s) {
    const n = ri(b.r, 8, 12);
    for (let i = 0; i < n; i++) { if (i > 1 && i < n - 2 && b.r() < .25 && !b.spec.noGaps) continue; b.col(s.x + i, s.gy); }
    for (let i = 2; i < n - 2; i += 3) b.s(s.x + i, s.gy - 3 - (i % 2), SEMI);
    s.x += n;
  },
  // water
  water(b, s) {
    const n = ri(b.r, 8, 14);
    for (let i = 0; i < n; i++) b.col(s.x + i, s.gy);
    const r = b.r();
    if (r < .3) { const h = ri(b.r, 3, 6), x = s.x + ri(b.r, 2, n - 3); for (let y = 0; y < h; y++) b.s(x, s.gy - 1 - y, HARD); if (b.r() < .5) b.s(x + 1, s.gy - h, HARD); }
    else if (r < .55) { const h = ri(b.r, 3, 5), x = s.x + ri(b.r, 2, n - 3); for (let y = 1; y <= h; y++) b.s(x, y, HARD); }
    else if (r < .75) { const y = ri(b.r, 5, 9); for (let i = 2; i < n - 2; i++) b.s(s.x + i, y, b.r() < .7 ? HARD : COIN); }
    for (let i = 0; i < 3; i++) if (b.r() < .5) b.s(s.x + ri(b.r, 0, n - 1), ri(b.r, 3, s.gy - 2), COIN);
    const ne = Math.round(b.r() * (1 + b.spec.diff * 2.5));
    for (let i = 0; i < ne; i++) b.ent(b.r() < .6 ? 'fish' : 'inkling', s.x + ri(b.r, 0, n - 1), ri(b.r, 3, s.gy - 2), { red: b.r() < .4 });
    s.x += n;
  },
  // sky / airship
  deck(b, s) {
    const n = ri(b.r, 5, 9), y = clamp(s.gy + ri(b.r, -2, 2), 7, 12); s.gy = y;
    for (let i = 0; i < n; i++) { b.s(s.x + i, y, WOOD); if (b.r() < .3) b.s(s.x + i, y + 1, WOOD); }
    if (b.r() < .6) { const x = s.x + ri(b.r, 1, n - 2); b.s(x, y - 1, HARD); b.ent('cannon', x, y - 1, { up: b.r() < .3 }); }
    if (b.r() < .35) b.ent('burner', s.x + ri(b.r, 1, n - 2), y);
    if (b.r() < .3) b.ent('goblin', s.x + n - 2, y - 1);
    s.x += n + ri(b.r, 1, 3);
  },
  clouds(b, s) {
    const n = ri(b.r, 6, 10), x0 = s.x;
    let x = x0;
    while (x < x0 + n) { const pw = ri(b.r, 2, 4), py = clamp(s.gy - ri(b.r, -1, 3), 5, 12); for (let i = 0; i < pw; i++) b.s(x + i, py, SEMI); if (b.r() < .4) b.s(x + 1, py - 2, COIN); if (b.r() < .3) placeEnemy(b, b.spec.game === 'smb2' || b.spec.game === 'yi' ? 'prophood' : 'para', x + 1, py - 1); x += pw + ri(b.r, 1, 2); }
    s.x = x;
  },
  // YI specials
  redcoins(b, s) { const n = ri(b.r, 6, 9); CH.flat(b, s, n); for (let i = 0; i < 3; i++) b.ent('redcoin', s.x - n + 1 + i * 2, s.gy - 2 - (i % 2)); },
  eggblock(b, s) { const n = 7; CH.flat(b, s, n); b.q(s.x - 4, s.gy - 4, 'eggs'); },
};

// chunk menus per level kind and game
function chunkMenu(sp) {
  const g = sp.game, k = sp.kind;
  if (k === 'castle' || k === 'fortress') return [['flat', 2], ['firebar', 3], ['lavapit', 3], ['lowceil', 1.5], ['platforms', 1], ['lift', 1], ['crusher', g === 'smb1' || g === 'lost' ? 0 : 2], ['bones', g === 'smb3' || g === 'smw' ? 2 : 0], ['stairs', 1], ['wisps', g === 'smb3' ? .7 : 0]];
  if (k === 'water') return [['water', 1]];
  if (k === 'ghost') return [['ghostfloor', 3], ['wisps', 3], ['flat', 1]];
  if (k === 'airship') return [['deck', 1]];
  if (k === 'sky') return [['clouds', 3], ['flat', 1], ['coinsky', 1], ['lift', 1]];
  if (k === 'tree') return [['platforms', 4], ['flat', 1], ['lift', g === 'smb2' || g === 'yi' ? 0 : 1.5], ['gap', 1], ['spring', .3]];
  const m = [['flat', 3], ['blocks', 3], ['gap', 2], ['stairs', 1.3], ['step', 1.5], ['platforms', 1]];
  if (g !== 'smb2') m.push(['pipes', 2]);
  if (sp.cannon) m.push(['cannon', 2.5]);
  if (sp.goblin) m.push(['goblin', 2]);
  if (g === 'smb3') m.push(['notes', 1.2], ['spring', .4]);
  if (g === 'smb2') m.push(['tufts', 3], ['ladder', 2], ['mushblocks', 1.3]);
  if (g === 'yi') m.push(['redcoins', 1.5], ['eggblock', 1.4]);
  if (g === 'smw') m.push(['coinsky', .7]);
  if (k === 'cave') m.push(['lowceil', 1]);
  return m;
}

function buildLevel(sp) {
  const seed = (sp.game.length * 7919 + sp.world * 131 + sp.level * 17 + (sp.seedOff || 0)) | 0;
  const b = new LB(sp, seed + 12345);
  const s = { x: 0, gy: 13 };
  const k = sp.kind;
  const cave = k === 'cave' || k === 'castle' || k === 'fortress' || k === 'ghost';
  const airy = k === 'airship' || k === 'sky';
  // start area
  if (airy) { for (let i = 0; i < 8; i++) b.col(i, 12, k === 'airship' ? WOOD : GROUND); s.gy = 12; s.x = 8; if (k === 'airship') for (let i = 0; i < 8; i++) for (let y = 13; y < 15; y++) b.s(i, y, 0); }
  else CH.flat(b, s, 9), b.e.length = 0;
  if (sp.pigStart) b.ent('pig', 5, s.gy - 1);
  const menu = chunkMenu(sp);
  const endLen = sp.end === 'axe' || sp.boss ? 26 : 22;
  let guard = 0, last = '';
  while (s.x < b.W - endLen && guard++ < 400) {
    let ch = wpick(b.r, menu); if (ch === last && b.r() < .6) ch = wpick(b.r, menu); last = ch;
    CH[ch](b, s);
    if (k === 'water' && b.r() < .25) s.gy = clamp(s.gy + pick(b.r, [-1, 1]), 10, 13);
  }
  // collectibles spread through the level
  const mid = Math.floor(b.W * .5);
  if (sp.game === 'smw' && k !== 'castle') for (let i = 0; i < 5; i++) b.ent('rune', Math.floor(b.W * (.12 + i * .17)), 4 + (i % 3));
  if (sp.game === 'yi') for (let i = 0; i < 5; i++) b.ent('flower', Math.floor(b.W * (.15 + i * .16)), 5 + (i % 3) * 2);
  if (sp.game === 'smb2') for (let i = 0; i < 6; i++) b.ent('cherry', Math.floor(b.W * (.1 + i * .14)), 7 + (i % 2) * 2);
  if ((sp.game === 'smw' || sp.game === 'yi') && k !== 'airship' && !sp.boss) b.ent('midway', mid, 0);
  if (sp.imp) b.ent('imp', 30, 3);
  if (sp.wind) b.wind = 1;
  // ending
  if (airy) { s.gy = 12; }
  if (s.x > b.W - endLen) { s.x = b.W - endLen; b.fill(s.x, 0, b.W - 1, b.H - 1, 0); b.e = b.e.filter(d => d.tx < s.x || ['rune', 'flower', 'cherry', 'midway', 'imp'].includes(d.type)); }
  const e0 = s.x;
  const endFloor = (n, y) => { for (let i = 0; i < n; i++) b.col(s.x + i, y, k === 'airship' ? WOOD : GROUND); };
  if (k === 'airship') { for (let x = s.x; x < b.W; x++) { b.s(x, 12, WOOD); b.s(x, 13, WOOD); } }
  else for (let x = s.x; x < b.W; x++) b.col(x, s.gy);
  if (sp.end === 'axe') {
