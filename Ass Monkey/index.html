<!DOCTYPE html>
<html lang="en">
<head>

<title>Ass Monkey Empire</title>

<style>
  :root {
    --yellow: #ffd23f;
    --orange: #ff9a1f;
    --brown: #3a1d07;
    --green: #4caf50;
    --pink: #ff6fa1;
    --ui: 'Fredoka', 'Segoe UI', system-ui, sans-serif;
    --title: 'Lilita One', 'Arial Black', Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--ui); user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .outline { text-shadow: -2px -2px 0 var(--brown), 2px -2px 0 var(--brown), -2px 2px 0 var(--brown), 2px 2px 0 var(--brown), 0 4px 0 var(--brown), 0 6px 12px rgba(0,0,0,.45); }

  /* ---------- Screens ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .screen.dim { background: radial-gradient(ellipse at center, rgba(10,5,0,.35) 0%, rgba(0,0,0,.78) 100%); }
  .logo { font-family: var(--title); font-size: clamp(56px, 11vw, 150px); line-height: .88; color: var(--yellow); -webkit-text-stroke: 5px var(--brown); paint-order: stroke fill;
          text-shadow: 0 8px 0 var(--brown), 0 14px 30px rgba(0,0,0,.55); letter-spacing: .02em; transform: rotate(-4deg); text-align: center; }
  .logo .m { color: #ff8a3d; }
  .logo .sub { display: block; font-size: .26em; color: #fff; -webkit-text-stroke: 2px var(--brown); text-shadow: 0 3px 0 var(--brown); letter-spacing: .08em; margin-top: 10px; }
  .tag { font-family: var(--ui); font-weight: 700; font-size: 15px; letter-spacing: .25em; text-transform: uppercase; color: #fff8dc; margin-top: 22px; }
  .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; width: min(460px, 100%); }
  .btn { font-family: var(--title); font-size: 24px; padding: 10px 24px; border-radius: 18px; border: 3px solid var(--brown); background: linear-gradient(#ffe68a, #ffb627); color: var(--brown);
         box-shadow: 0 5px 0 var(--brown), 0 10px 22px rgba(0,0,0,.35); cursor: pointer; text-align: center; transition: transform .09s, filter .09s; position: relative; }
  .btn .s { display: block; font-family: var(--ui); font-size: 13px; font-weight: 700; opacity: .75; letter-spacing: .04em; }
  .btn.focus, .btn:hover { transform: translateY(-3px) scale(1.035); background: linear-gradient(#fff6c4, #ffd24d); outline: 4px solid rgba(255,255,255,.75); outline-offset: 2px; }
  .btn.disabled { filter: grayscale(1) brightness(.75); }
  .btn .val { color: #8a3b00; }
  .panel { background: rgba(28,14,2,.72); border: 3px solid rgba(255,210,63,.85); border-radius: 24px; padding: 22px 26px; backdrop-filter: blur(8px); box-shadow: 0 20px 50px rgba(0,0,0,.5); max-width: min(760px, 100%); }
  .panel h2 { font-family: var(--title); font-size: 34px; margin: 0 0 14px; color: var(--yellow); }
  table.keys { border-collapse: collapse; font-size: 15px; width: 100%; }
  table.keys td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  table.keys td:first-child { color: #ffe9a6; font-weight: 700; }
  .hint { font-size: 13px; opacity: .8; margin-top: 16px; letter-spacing: .05em; text-align: center; }
  kbd { font-family: var(--ui); background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-size: 12px; }

  /* ---------- Map ---------- */
  #map { align-items: flex-start; justify-content: flex-start; padding: 0; }
  #mapPanel { position: absolute; left: max(16px, 3vw); top: 4vh; bottom: 4vh; width: min(470px, calc(100vw - 32px)); display: flex; flex-direction: column; }
  #mapGame { font-family: var(--title); font-size: 18px; color: #ffe9a6; letter-spacing: .04em; }
  #mapWorldRow { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
  #mapWorldRow .arrow { font-family: var(--title); font-size: 30px; color: var(--yellow); cursor: pointer; padding: 0 6px; }
  #mapWorldRow .arrow.off { opacity: .2; }
  #mapWorld { font-family: var(--title); font-size: clamp(26px, 3.4vw, 38px); color: var(--yellow); flex: 1; text-align: center; line-height: 1; }
  #mapWorldNo { text-align: center; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; opacity: .75; }
  #mapLevels { list-style: none; padding: 0; margin: 14px 0 0; overflow-y: auto; flex: 1; }
  #mapLevels li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 14px; margin-bottom: 6px; cursor: pointer; border: 2px solid transparent; }
  #mapLevels li .dot { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--title); font-size: 15px; color: var(--brown);
                       background: radial-gradient(circle at 35% 30%, #fff6c4, #ffb627); border: 2px solid var(--brown); box-shadow: 0 3px 0 var(--brown); }
  #mapLevels li.boss .dot { background: radial-gradient(circle at 35% 30%, #ffb4b4, #e2402f); color: #fff; }
  #mapLevels li.done .dot { background: radial-gradient(circle at 35% 30%, #d6ffc8, #4caf50); }
  #mapLevels li.locked { opacity: .38; }
  #mapLevels li .nm { flex: 1; font-weight: 700; font-size: 17px; }
  #mapLevels li .nm small { display: block; font-weight: 600; font-size: 12px; opacity: .7; letter-spacing: .06em; text-transform: uppercase; }
  #mapLevels li .st { font-size: 12px; text-align: right; line-height: 1.35; white-space: nowrap; }
  #mapLevels li .st b { color: var(--yellow); }
  #mapLevels li.focus { background: rgba(255,210,63,.18); border-color: var(--yellow); }
  #mapFoot { font-size: 13px; opacity: .85; margin-top: 10px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  #mapStats { position: absolute; right: max(16px, 3vw); top: 4vh; text-align: right; }
  #mapStats .big { font-family: var(--title); font-size: 34px; color: var(--yellow); }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: var(--title); }
  .hbox { position: absolute; display: flex; align-items: center; gap: 8px; font-size: 34px; color: #fff; }
  #hBan { left: 22px; top: 16px; }
  #hLives { right: 22px; top: 16px; }
  #hBan svg, #hLives svg { width: 44px; height: 44px; filter: drop-shadow(0 3px 0 var(--brown)); }
  #hLetters { left: 50%; top: 16px; transform: translateX(-50%); gap: 6px; }
  #hLetters span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; color: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.18); }
  #hLetters span.on { color: var(--brown); background: radial-gradient(circle at 35% 30%, #fff3b0, #f0a400); border-color: var(--brown); box-shadow: 0 3px 0 var(--brown); }
  #hDuo { left: 22px; top: 72px; gap: 6px; }
  #hDuo i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--brown); display: block; box-shadow: 0 3px 0 var(--brown); }
  #hDuo i.gone { opacity: .25; filter: grayscale(1); }
  #hMedal { right: 22px; top: 72px; font-size: 22px; }
  #hTimer { left: 50%; top: 70px; transform: translateX(-50%); font-size: 46px; color: var(--yellow); }
  #hBoss { left: 50%; bottom: 26px; transform: translateX(-50%); flex-direction: column; gap: 4px; font-size: 22px; }
  #hBossBar { width: min(420px, 70vw); height: 18px; border: 3px solid var(--brown); border-radius: 10px; background: rgba(0,0,0,.4); overflow: hidden; box-shadow: 0 3px 0 var(--brown); }
  #hBossFill { height: 100%; width: 100%; background: linear-gradient(#ff8a7a, #d3241a); transition: width .25s; }
  #hMsg { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: clamp(40px, 7vw, 92px); color: var(--yellow); line-height: 1; opacity: 0; transition: opacity .3s, transform .3s; transform: scale(.9); }
  #hMsg.show { opacity: 1; transform: scale(1); }
  #hMsg small { display: block; font-size: .36em; color: #fff; margin-top: 12px; }
  #hTip { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); font-family: var(--ui); font-weight: 700; font-size: 16px; background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 12px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hTip.show { opacity: 1; }
  #hPop { position: absolute; inset: 0; }
  .pop { position: absolute; font-size: 22px; color: var(--yellow); transform: translate(-50%, -50%); animation: pop 0.9s ease-out forwards; }
  @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -50px; } }

  #fade { position: fixed; inset: 0; background: #000; z-index: 50; pointer-events: none; opacity: 1; transition: opacity .45s; }
  #loading { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #120800; font-family: var(--title); font-size: 34px; color: var(--yellow); }
  @media (max-width: 640px) { .hbox { font-size: 24px; } #hLetters span { width: 30px; height: 30px; font-size: 18px; } #hBan svg, #hLives svg { width: 32px; height: 32px; } }
</style>
</head>

<canvas id="c"></canvas>
<div id="loading">Peeling bananas…</div>

<div id="hud" class="hidden">
  <div class="hbox outline" id="hBan"><svg viewBox="0 0 48 48"><path d="M8 10c-2 14 6 30 26 30 4 0 7-1 8-3-16 0-24-12-25-27-1-4-8-4-9 0z" fill="#ffd23f" stroke="#3a1d07" stroke-width="3" stroke-linejoin="round"/><path d="M10 9l-1-5 5 1z" fill="#6b4a1f" stroke="#3a1d07" stroke-width="2"/></svg><span id="hBanN">0</span></div>

<div id="title" class="screen hidden">
  <div class="logo">ASS <span class="m">MONKEY</span><br>EMPIRE<span class="sub" id="titleSub">THE BANANA TRILOGY</span></div>
  <div class="tag">Three jungle adventures · rebuilt in 3D</div>
  <div class="menu" id="titleMenu"></div>
  <div class="hint"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd>/<kbd>Space</kbd> select · gamepad supported</div>
</div>

  <div id="mapPanel" class="panel">

    <div id="mapWorldRow"><span class="arrow" id="mapPrev">◀</span><div id="mapWorld"></div><span class="arrow" id="mapNext">▶</span></div>
    <div id="mapWorldNo"></div>
    <ul id="mapLevels"></ul>
    <div id="mapFoot"><span><kbd>◀</kbd><kbd>▶</kbd> world · <kbd>↑</kbd><kbd>↓</kbd> level · <kbd>Enter</kbd> play</span><span><kbd>Esc</kbd> title</span></div>
  </div>
  <div id="mapStats" class="outline"></div>
</div>

<div id="pause" class="screen dim hidden">
  <div class="logo" style="font-size:72px">PAUSED</div>
  <div class="menu" id="pauseMenu"></div>
</div>

<div id="info" class="screen dim hidden">
  <div class="panel" id="infoPanel"></div>
  <div class="menu" id="infoMenu" style="width:min(300px,100%)"></div>
</div>

<div id="fade"></div>

<script type="module">
import * as THREE from 'three';

// =====================================================================

const V2 = THREE.Vector2, V3 = THREE.Vector3;

const $ = id => document.getElementById(id);

  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }

// =====================================================================

const SURF = {
  dirt:   { p: 6, c: ['#3c2412', '#7d5230', '#26160a'], ns: 3, rough: .95, decor: 'pebbles' },
  grass:  { p: 8, c: ['#2a5a18', '#62a12f', '#1d4010'], ns: 2.5, rough: .9, decor: 'blades' },

  metal:  { p: 6, c: ['#4f5763', '#99a3ae', '#33383f'], ns: 2.5, rough: .42, metal: .65, decor: 'plates' },
  wood:   { p: 6, c: ['#5b3518', '#9a6534', '#3a210d'], ns: 2.5, rough: .8, decor: 'planks' },
  deck:   { p: 6, c: ['#5e3a1c', '#a26d3b', '#3a220e'], ns: 2.5, rough: .8, decor: 'deckplanks' },
  basalt: { p: 5, c: ['#1f1b1c', '#4b403c', '#120f10'], ns: 3.5, rough: .9, decor: 'lavacracks', emissive: true },
  mud:    { p: 5, c: ['#2f2113', '#5d4327', '#1b130a'], ns: 2, rough: .38, decor: 'pebbles' },
  sand:   { p: 6, c: ['#b8925a', '#e7d29a', '#9b7744'], ns: 1.5, rough: .95, decor: 'grains' },
  crystal:{ p: 5, c: ['#2d2149', '#6a4fa5', '#1a1230'], ns: 3, rough: .6, decor: 'crystals', emissive: true },
  bark:   { p: 4, c: ['#3b2716', '#6e4b2c', '#22160b'], ns: 3, rough: .9, decor: 'bark' },
  moss:   { p: 7, c: ['#23461b', '#4f7d2a', '#162d10'], ns: 2.5, rough: .95, decor: 'blades' },
  coral:  { p: 5, c: ['#8d4a5a', '#e48a77', '#5c2a3a'], ns: 3, rough: .8, decor: 'pores' },
  tech:   { p: 6, c: ['#1d2533', '#3c4d66', '#10151f'], ns: 2, rough: .35, metal: .5, decor: 'circuits', emissive: true },
  stave:  { p: 6, c: ['#6a3f1c', '#a8713c', '#43260f'], ns: 2.5, rough: .75, decor: 'staves' },

  bramble:{ p: 6, c: ['#2d2a12', '#5d5422', '#1a180a'], ns: 3, rough: .8, decor: 'bark' },

const surfCache = {};

  <tr><td>Run · roll · pick up &amp; throw barrels (hold, release)</td><td>Shift / J / X · □ (X) · R2</td></tr>
  <tr><td>Ground slap (Bongo, Bobo)</td><td>↓ + run button</td></tr>
  <tr><td>Glide (Lulu)</td><td>Hold jump while falling</td></tr>
  <tr><td>Team-up throw (games 2 &amp; 3)</td><td>E / L / C · △ (Y) · L2 · hold ↑ to throw high</td></tr>
  <tr><td>Swap monkeys</td><td>Q / Tab · L1 / R1</td></tr>
  <tr><td>Pause</td><td>Esc / P · Options</td></tr></table>
  <p class="hint" style="text-align:left">Stomp enemies or roll into them. Spiky stingers only fall to barrels and animal buddies. Collect 100 bananas or B-U-T-T for an extra life.
  Break DUO barrels to get your partner back. Purple <b>B</b> cannons launch you into bonus rooms: clear them for bonus medals, which unlock the secret worlds in games 2 and 3.</p>`;
  setMenu($('infoMenu'), [{ label: 'Back', act: () => goTitle(4) }], () => goTitle(4));
}
function openPause() {
  G.mode = 'pause'; showScreen('pause'); if (AU.ctx) AU.ctx.suspend();
  const resume = () => { showScreen(null); G.mode = 'play'; AU.ctx && AU.ctx.resume(); };
  setMenu($('pauseMenu'), [{ label: 'Resume', act: resume }, { label: 'Restart level', act: () => { AU.ctx && AU.ctx.resume(); startLevel(G.gi, G.wi, G.li); } }, { label: 'Exit to map', act: () => { AU.ctx && AU.ctx.resume(); goMap(); } }], resume);
}
async function showEnding() {
  G.mode = 'loading'; fade(true); await wait(500); teardown(); $('hud').classList.add('hidden'); setDiorama(G.game, G.game.worlds.length - 1); fade(false);
  showScreen('info'); const g = G.game, S = gsv(); let med = 0, tot = 0; g.worlds.forEach(w => w.lv.forEach(l => { const m = S.medals[l.id] || []; med += m.filter(Boolean).length; }));
  $('infoPanel').innerHTML = `<h2>THE END</h2><p style="font-size:18px;line-height:1.5">${g.title}: ${g.sub} is complete! The banana hoard is safe… for now.</p><p>Progress ${gameProgress(g)}% · Bonus medals ${med}</p>${g.worlds.some(w => w.secret) ? '<p class="hint" style="text-align:left">Collect bonus medals to open the secret world on the map.</p>' : ''}`;
  playMusic('map'); setMenu($('infoMenu'), [{ label: 'Back to map', act: () => goMap() }], () => goMap()); G.mode = 'title';
}
// ---- world map ----
const MAP = { wi: 0, li: 0 };
function medalCount(g) { const S = gsave(g.id); let n = 0; for (const k in S.medals) n += (S.medals[k] || []).filter(Boolean).length; return n; }
function worldUnlocked(g, wi) { const S = gsave(g.id), W = g.worlds[wi]; if (W.secret) return medalCount(g) >= W.secret; if (wi === 0) return true; const prev = g.worlds[wi - 1]; return !!S.done[prev.lv[prev.lv.length - 1].id]; }
function levelUnlocked(g, wi, li) { const S = gsave(g.id); return worldUnlocked(g, wi) && (li === 0 || !!S.done[g.worlds[wi].lv[li - 1].id]); }
function goMap(advance = false) {
  teardown(); G.mode = 'map'; $('hud').classList.add('hidden'); fade(false); const g = G.game = GAMES[G.gi]; ensureModels(); showScreen('map'); menu = null;
  if (advance) { const W = g.worlds[G.wi]; if (G.li + 1 < W.lv.length) { MAP.wi = G.wi; MAP.li = G.li + 1; } else if (G.wi + 1 < g.worlds.length && worldUnlocked(g, G.wi + 1)) { MAP.wi = G.wi + 1; MAP.li = 0; } else { MAP.wi = G.wi; MAP.li = G.li; } }
  else if (MAP.g !== g.id) { MAP.wi = 0; MAP.li = 0; for (let w = 0; w < g.worlds.length; w++) if (worldUnlocked(g, w) && !g.worlds[w].secret) { MAP.wi = w; MAP.li = 0; for (let l = 0; l < g.worlds[w].lv.length; l++) if (levelUnlocked(g, w, l)) MAP.li = l; } }
  MAP.g = g.id; drawMap(); playMusic('map');
}
function drawMap() {
  const g = G.game, S = gsave(g.id), W = g.worlds[MAP.wi];
  $('mapGame').textContent = `${g.title}: ${g.sub}`;
  $('mapWorld').textContent = worldUnlocked(g, MAP.wi) ? W.n : '???'; $('mapWorldNo').textContent = W.secret ? `Secret world · ${W.secret} medals` : `World ${MAP.wi + 1}`;
  $('mapPrev').classList.toggle('off', MAP.wi === 0); $('mapNext').classList.toggle('off', MAP.wi >= g.worlds.length - 1);
  $('mapPrev').onclick = () => mapWorld(-1); $('mapNext').onclick = () => mapWorld(1);
  const ul = $('mapLevels'); ul.innerHTML = '';
  W.lv.forEach((l, i) => { const li = document.createElement('li'); const un = levelUnlocked(g, MAP.wi, i), done = S.done[l.id]; const med = S.medals[l.id] || [];
    li.className = (l.a === 'boss' ? 'boss ' : '') + (done ? 'done ' : '') + (un ? '' : 'locked ') + (i === MAP.li ? 'focus' : '');
    const kind = { run: 'Jungle run', tree: 'Treetops', water: 'Underwater', cannon: 'Barrel cannons', cart: 'Mine cart', dark: 'Lights out', ice: 'Slippery ice', factory: 'Machinery', bramble: 'Brambles', rig: 'Rigging', lava: 'Hot lava', climb: 'Rising climb', boss: 'Boss' }[l.a];
    li.innerHTML = `<div class="dot">${l.a === 'boss' ? '!' : i + 1}</div><div class="nm">${un ? l.n : '? ? ?'}<small>${kind}</small></div><div class="st">${done ? '<b>✓ cleared</b>' : un ? 'new' : '🔒'}${l.a !== 'boss' ? `<br>${S.letters[l.id] ? '<b>BUTT</b> · ' : ''}${med.filter(Boolean).length}/${l.a === 'water' ? 0 : (l.d <= 1 ? 1 : 2)} ★` : ''}</div>`;
    li.onclick = () => { MAP.li = i; drawMap(); mapPlay(); }; ul.appendChild(li); });
  let tot = 0, d = 0; g.worlds.forEach(w => w.lv.forEach(l => { tot++; if (S.done[l.id]) d++; }));
  $('mapStats').innerHTML = `<div class="big">${Math.round(d / tot * 100)}%</div>Lives ${S.lives} · Bananas ${S.bananas || 0}<br>Bonus medals ${medalCount(g)}`;
  setDiorama(g, MAP.wi);
}
function mapWorld(d) { const g = G.game; const n = clamp(MAP.wi + d, 0, g.worlds.length - 1); if (n === MAP.wi) return; MAP.wi = n; MAP.li = 0; sfx('move'); drawMap(); }
function mapPlay() { const g = G.game; if (!levelUnlocked(g, MAP.wi, MAP.li)) { sfx('hurt'); return; } sfx('select'); startLevel(G.gi, MAP.wi, MAP.li); }
function mapInput() {
  const W = G.game.worlds[MAP.wi];
  if (hit('left')) mapWorld(-1); if (hit('right')) mapWorld(1);
  if (hit('down')) { MAP.li = (MAP.li + 1) % W.lv.length; sfx('move'); drawMap(); }
  if (hit('up')) { MAP.li = (MAP.li - 1 + W.lv.length) % W.lv.length; sfx('move'); drawMap(); }
  if (hit('ok') || hit('jump')) mapPlay();
  if (hit('back') || hit('pause')) { sfx('move'); goTitle(G.gi); }
}
// ---- 3D diorama behind menus ----
const DIO = { key: null, t: 0 };
function setDiorama(g, wi) {
  const W = g.worlds[wi], key = g.id + ':' + W.th; if (DIO.key === key && G.world) return; DIO.key = key;
  G.game = g; ensureModels(); teardown();
  const lv = { id: 'dio-' + W.th, a: 'diorama', th: W.th, d: 1, n: W.n };
  const th = THEMES[W.th]; G.lv = lv; G.world = buildWorld(genLevel(lv), th, scene); applyTheme(th, lv); setWeather(th.part); G.ents = []; G.plats = []; spawnRecords();
  P.lead = g.duo[0]; P.fol = g.duo[1];
}
function updateMenuScene(dt) {
  if (!G.world) return; DIO.t += dt; G.t += dt;
  const [a, b] = G.game.duo, ma = G.models[a], mb = G.models[b];
  for (const m of Object.values(G.models)) m.root.visible = false; for (const m of Object.values(G.buddyModels || {})) m.root.visible = false;
  ma.root.visible = mb.root.visible = true; ma.root.position.set(30, 3, 0); mb.root.position.set(31.6, 3, .3);
  poseMonkey(ma, { mode: 'idle', t: DIO.t, speed: 0, facing: 1 }, dt); poseMonkey(mb, { mode: Math.sin(DIO.t * .7) > .6 ? 'dance' : 'idle', t: DIO.t, speed: 0, facing: -1 }, dt);
  ma.root.rotation.y = .5; mb.root.rotation.y = -.5 + Math.sin(DIO.t) * .1;
  if (G.bananaInst) { const im = G.bananaInst; for (const bn of G.bananas) { _m4.compose(_p.set(bn.x, bn.y + Math.sin(G.t * 2.5 + bn.ph) * .06, 0), _q.setFromEuler(_e.set(0, G.t * 2.2 + bn.ph, .25)), _s.set(1, 1, 1)); im.setMatrixAt(bn.i, _m4); } im.instanceMatrix.needsUpdate = true; }
  const a2 = Math.sin(DIO.t * .15) * .5, menuShift = G.mode === 'map' ? -4.5 : 0;
  camera.position.set(31 + Math.sin(a2) * 13 + menuShift, 6.5 + Math.sin(DIO.t * .2) * .6, Math.cos(a2) * 13); camera.lookAt(31 + menuShift * .6, 3.6, 0);
  sun.position.set(camera.position.x - 10, 30, 24); sun.target.position.set(31, 2, 0); G.cam.x = 31; G.cam.y = 6;
  if (G.world.sky) G.world.sky.position.set(31, 6, 0);
  for (const f of G.world.anim) f(dt); updateLamps();
}

// =====================================================================
//  Main loop & boot
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 1 / 20); last = now; SHARED.time.value += dt;
  pollPad(); const m0 = G.mode;
  try {
    if (G.mode === 'play') updatePlay(dt);
    else if (G.mode === 'title' || G.mode === 'map' || (G.mode === 'info' || !$('info').classList.contains('hidden'))) updateMenuScene(dt);
    if (m0 !== 'play' && G.mode !== 'play' && G.mode !== 'loading') menuInput();
    if (G.mode !== 'pause') { FXG.update(dt); FXS.update(dt); updateWeather(dt, G.cam.x, G.cam.y); }
  } catch (err) { console.error(err); }
  const sc = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  for (const p of [FXG, FXS, WX, WXG]) p.pts.material.uniforms.scale.value = sc;
  composer.render();
  clearInput(); requestAnimationFrame(frame);
}
async function boot() {
  try { await Promise.race([document.fonts.load('80px "Lilita One"'), wait(2500)]); } catch (e) { }
  makeFur(); setupComposer();
  G.gi = 0; G.game = GAMES[0];
  goTitle(0);
  $('loading').classList.add('hidden'); fade(false);
  requestAnimationFrame(frame);
}
boot();
</script>
