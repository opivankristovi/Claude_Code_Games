<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>X-Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--hud:#7fe3ff;--hud-dim:rgba(127,227,255,.45);--warn:#ff5a3c;--gold:#ffcc55;--bg:#02040a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--hud);font-family:'Rajdhani',sans-serif;user-select:none}
canvas{display:block}
#gl{position:fixed;inset:0}
#hud2d{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.panel{position:absolute;font-family:'Orbitron',sans-serif;letter-spacing:.12em;text-shadow:0 0 8px rgba(127,227,255,.6)}
#tl{top:18px;left:24px}
#tc{top:14px;left:50%;transform:translateX(-50%);text-align:center;width:min(560px,60vw)}
#tr{top:18px;right:24px;text-align:right}
#bl{bottom:22px;left:24px;width:min(260px,34vw)}
#br{bottom:22px;right:24px;text-align:right}
.lbl{font-size:11px;color:var(--hud-dim);font-weight:500}
.big{font-size:26px;font-weight:700}
#timer{font-size:34px;font-weight:900}
#timer.low{color:var(--warn);text-shadow:0 0 10px rgba(255,90,60,.8)}
#objective{font-family:'Rajdhani';font-size:15px;letter-spacing:.08em;color:#cfefff;margin-top:2px}
.bar{height:12px;border:1px solid var(--hud-dim);margin-top:4px;position:relative;background:rgba(0,20,30,.4);clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.bar>i{position:absolute;left:1px;top:1px;bottom:1px;width:100%;background:linear-gradient(90deg,#2bb8ff,#8ff0ff);box-shadow:0 0 10px #4cd2ff}
.bar.boost>i{background:linear-gradient(90deg,#ff9a2b,#ffd27a);box-shadow:0 0 10px #ffa63c}
.bar.crit>i{background:linear-gradient(90deg,#ff2d2d,#ff7a5a);box-shadow:0 0 10px #ff3c3c}
#torps{margin-top:4px;min-height:20px}
#torps span{display:inline-block;width:9px;height:20px;margin-left:4px;background:var(--gold);box-shadow:0 0 8px var(--gold);clip-path:polygon(50% 0,100% 25%,100% 100%,0 100%,0 25%)}
#torps span.used{background:rgba(255,204,85,.15);box-shadow:none}
#msg{position:fixed;top:28%;left:0;right:0;text-align:center;font-family:'Orbitron';font-weight:900;font-size:clamp(20px,3.4vw,44px);letter-spacing:.2em;color:#fff;text-shadow:0 0 18px var(--hud),0 0 40px rgba(127,227,255,.5);opacity:0;transition:opacity .35s;pointer-events:none;padding:0 16px}
#msg small{display:block;font-family:'Rajdhani';font-size:.42em;letter-spacing:.25em;color:var(--hud);margin-top:10px;font-weight:600}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,10,.6) 100%);opacity:0}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(2,6,16,.1),rgba(2,4,10,.8));cursor:pointer;padding:16px}
#screen h1{font-family:'Orbitron';font-weight:900;font-size:clamp(40px,9vw,118px);letter-spacing:.12em;color:#fff;text-shadow:0 0 24px #4cc8ff,0 0 60px rgba(76,200,255,.6);line-height:1}
#screen h2{font-family:'Orbitron';font-weight:700;font-size:clamp(16px,2.4vw,28px);letter-spacing:.24em;color:var(--gold);text-shadow:0 0 14px rgba(255,204,85,.6)}
#screen h3{font-family:'Orbitron';font-weight:900;font-size:clamp(28px,5.5vw,64px);letter-spacing:.14em;color:#fff;text-shadow:0 0 24px #4cc8ff;margin-top:8px}
#screen p{font-size:19px;max-width:640px;line-height:1.5;color:#cfe9f7;margin-top:16px}
.sub{font-family:'Orbitron';font-size:13px;letter-spacing:.5em;color:var(--hud);margin-top:12px}
.cta{margin-top:30px;font-family:'Orbitron';font-size:15px;letter-spacing:.3em;color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.keys{margin-top:26px;display:grid;grid-template-columns:auto auto;gap:7px 20px;font-size:16px;text-align:left;color:#a9d6ea;background:rgba(0,10,20,.45);border:1px solid rgba(127,227,255,.2);padding:16px 22px;border-radius:6px}
.keys b{font-family:'Orbitron';font-size:11px;letter-spacing:.1em;color:#fff;background:rgba(127,227,255,.12);border:1px solid var(--hud-dim);padding:3px 7px;border-radius:3px;white-space:nowrap;justify-self:end}
.g{font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',sans-serif;font-size:1.15em;line-height:1}
.stats{margin-top:20px;font-family:'Orbitron';font-size:15px;letter-spacing:.15em;line-height:2;color:#dff6ff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';letter-spacing:.4em;color:var(--hud);background:var(--bg);z-index:10}
@media (max-width:700px){#tc{top:64px}.keys{font-size:14px}}
</style>

<script type="module">
import * as THREE from 'three';

// ======================================================================
// Utilities
// ======================================================================
const V3 = THREE.Vector3, Q = THREE.Quaternion;

// ======================================================================
// Renderer / scene / post
// ======================================================================
let W = innerWidth, H = innerHeight;
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.domElement.id = 'gl';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(68, W / H, 0.5, 42000);
scene.add(camera);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.55, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const sunDir = new V3(0.6, 0.4, -0.45).normalize();
const sunLight = new THREE.DirectionalLight(0xfff0dc, 3.2);
sunLight.position.copy(sunDir).multiplyScalar(1000);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0x6f8cff, 0x2a1830, 0.55));

// ======================================================================
// Procedural textures
// ======================================================================
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

}
function makeSoft() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.85)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const SOFT = makeSoft();

// Greebled hull plating: recursive panel subdivision + vents, rivets, lit windows, glowing seams
function makeHull(o = {}) {
  const size = o.size || 1024, hue = o.hue ?? 210, sat = o.sat ?? 6, light = o.light ?? 60, vr = o.vr ?? 8;
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const e = document.createElement('canvas'); e.width = e.height = size; const ge = e.getContext('2d');
  ge.fillStyle = '#000'; ge.fillRect(0, 0, size, size);
  g.fillStyle = `hsl(${hue},${sat}%,${light}%)`; g.fillRect(0, 0, size, size);
  const q = s => Math.max(16, Math.round(s / 16) * 16);
  function panel(x, y, w, h, d) {
    if (d < 5 && (w >= 64 || h >= 64) && (d < 2 || Math.random() < 0.78)) {
      const splitV = w > h ? Math.random() < 0.8 : (w === h ? Math.random() < 0.5 : Math.random() < 0.2);
      if (splitV && w >= 32) { let s = q(w * rand(0.3, 0.7)); if (s >= w) s = w / 2; panel(x, y, s, h, d + 1); panel(x + s, y, w - s, h, d + 1); return; }
      if (!splitV && h >= 32) { let s = q(h * rand(0.3, 0.7)); if (s >= h) s = h / 2; panel(x, y, w, s, d + 1); panel(x, y + s, w, h - s, d + 1); return; }
    }
    const l = light + rand(-vr, vr);
    g.fillStyle = `hsl(${hue + rand(-4, 4)},${sat}%,${l}%)`; g.fillRect(x, y, w, h);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x, y, w, 2); g.fillRect(x, y, 2, h);
    g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(x, y + h - 2, w, 2); g.fillRect(x + w - 2, y, 2, h);
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 1.5; g.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
    const r = Math.random();
    if (r < 0.12 && w > 28 && h > 28) {
      g.fillStyle = 'rgba(0,0,0,0.38)'; for (let yy = y + 6; yy < y + h - 6; yy += 5) g.fillRect(x + 6, yy, w - 12, 2);
    } else if (r < 0.22) {

      for (const [px, py] of [[x + 5, y + 5], [x + w - 5, y + 5], [x + 5, y + h - 5], [x + w - 5, y + h - 5]]) { g.beginPath(); g.arc(px, py, 1.6, 0, 7); g.fill(); }
    } else if (r < 0.22 + (o.windows || 0) && w > 30) {

      for (let k = 0; k < rows; k++) {
        const wy = y + h * (k + 1) / (rows + 1) - 2;
        for (let xx = x + 6; xx < x + w - 9; xx += 8) {
          if (Math.random() < 0.85) {
            g.fillStyle = '#14161a'; g.fillRect(xx, wy, 5, 4);
            if (Math.random() < 0.7) { ge.fillStyle = o.winColor || '#ffd59a'; ge.globalAlpha = rand(0.45, 1); ge.fillRect(xx, wy, 5, 4); ge.globalAlpha = 1; }

const rockC = makeRock();

const M = {
  player: new THREE.MeshStandardMaterial({ map: tex(tPlayer.c), bumpMap: tex(tPlayer.c, false), bumpScale: 1.2, metalness: 0.35, roughness: 0.42, envMapIntensity: 0.55 }),

  greeble: new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.6, envMapIntensity: 0.3 }),
  turret: new THREE.MeshStandardMaterial({ color: 0x5a606a, metalness: 0.6, roughness: 0.45, envMapIntensity: 0.4 }),
  dome: new THREE.MeshStandardMaterial({ color: 0x9fb0c4, metalness: 0.85, roughness: 0.22, envMapIntensity: 0.9 }),

  amberLight: new THREE.MeshBasicMaterial({ color: hdr(1, 0.6, 0.2, 6) }),
  cyanLight: new THREE.MeshBasicMaterial({ color: hdr(0.3, 0.9, 1, 5) }),
  black: new THREE.MeshBasicMaterial({ color: 0x000000 }),

// ======================================================================
// Environment: nebula sky, stars, planet, space dust, asteroids
// ======================================================================
const NOISE = `

  if (e.code === 'KeyV') camView = camView === 'chase' ? 'cockpit' : 'chase';
  if (e.code === 'KeyM') Sfx.toggleMute();
  if (e.code === 'KeyI') { invertY = !invertY; showMsg('', invertY ? 'PITCH INVERTED' : 'PITCH NORMAL', 1.2); }
  if ((e.code === 'KeyF' || e.code === 'Enter') && state === 'playing') torpRequest = true;
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') ignoreSpace = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / W) * 2 - 1; mouse.y = (e.clientY / H) * 2 - 1;
  if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) mouse.active = true;
});
addEventListener('mousedown', e => {
  if (state !== 'playing') return;
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) torpRequest = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
addEventListener('contextmenu', e => e.preventDefault());
screenEl.addEventListener('click', () => advance());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });
function onResize() {
  W = innerWidth; H = innerHeight; camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H); composer.setSize(W, H); resizeHud(); computePointScale();
}
addEventListener('resize', onResize);

// ======================================================================
// Main loop
// ======================================================================
function simulate(dt) {
  if (state === 'playing') { stageTime -= dt; if (stageTime <= 0) { stageTime = 0; timeUp(); } }
  targetsList.length = 0; stage.targets(targetsList);
  if (player.alive) { stage.trench ? updatePlayerTrench(dt) : updatePlayerFree(dt); }
  stage.update(dt);
  updateFighters(dt);
  pBolts.update(dt, playerBoltHit); eBolts.update(dt, enemyBoltHit);
  updateTorps(dt);
  targetsList.length = 0; stage.targets(targetsList);
  updateLock(dt);
  player.invuln -= dt;
  if (state === 'playing' && player.shield < 30) { player.alarmT -= dt; if (player.alarmT <= 0) { player.alarmT = 1.1; Sfx.alarm(); } }
  if (state === 'dying') { dieT -= dt; if (dieT <= 0) showGameOver(); }
  if (state === 'clear') { clearT -= dt; if (clearT <= 0) nextStage(); }
  Sfx.engine(player.alive ? 1 : 0, player.boosting);
}
function attract(dt) {
  playerShip.root.visible = true;
  playerShip.root.position.copy(player.pos); playerShip.root.quaternion.copy(player.quat);
  playerShip.body.rotation.set(Math.sin(time * 0.7) * 0.04, 0, Math.sin(time * 0.5) * 0.12);
  playerShip.root.updateMatrixWorld(true);
  player.fwd.set(0, 0, -1).applyQuaternion(player.quat); player.boosting = 0;
  for (let i = 0; i < 4; i++) {
    playerShip.exhausts[i].getWorldPosition(_v1);
    fx.emit(_v1.x, _v1.y, _v1.z, -player.fwd.x * 60, -player.fwd.y * 60, -player.fwd.z * 60, 0.25, 0.75, 0.1, 1.8, 0.7, 0.3, 0.4, 0.04, 0.01, 0, 0.7);
  }
  if (stage === STAGE2) { for (const t of dread.turrets) t.head.lookAt(player.pos); dread.bubbleMat.uniforms.time.value = time; }
  if (Sfx.eg) Sfx.engine(0.35, 0);
}
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now;
  pollPad();
  if (state === 'paused') { composer.render(); return; }
  time += dt;
  if (state === 'title' || state === 'briefing') attract(dt);
  else if (state === 'playing' || state === 'dying' || state === 'clear') simulate(dt);
  else if (Sfx.eg) Sfx.engine(0, 0);
  fx.update(dt); smoke.update(dt); updateDebris(dt); updateRings(dt); updateAsteroids(dt);
  for (const l of flashLights) l.intensity *= Math.exp(-6 * dt);
  planetMat.uniforms.time.value = time;
  for (const s of dread.sprites) { const k = s.userData.k || (s.userData.k = s.scale.x); s.scale.setScalar(k * rand(0.96, 1.04)); }
  updateCamera(dt);
  drawHUD(dt);
  composer.render();
}

onResize();
showTitle();
{ const m = +new URLSearchParams(location.search).get('mission'); if (m >= 1 && m <= STAGES.length) showBriefing(m - 1); }
$('loading').remove();
requestAnimationFrame(loop);
</script>
