<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katana Creed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c4202e;
    --red-dim: #7a1119;
    --ink: #0b0c10;
    --paper: #e9e2d0;
    --gold: #d8b45a;
    --ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --serif: 'Cinzel', 'Times New Roman', serif;
    --jp: 'Noto Serif JP', 'Yu Mincho', 'MS Mincho', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--paper); font-family: var(--ui); user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* ---------- Screens & menus ---------- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
  .screen.dim { background: radial-gradient(ellipse at center, rgba(5,6,10,.55) 0%, rgba(0,0,0,.88) 100%); }
  .screen.side { align-items: flex-start; padding-left: 8vw; background: linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 75%); }
  .logo { font-family: var(--serif); font-weight: 900; font-size: clamp(42px, 7vw, 96px); letter-spacing: .12em; color: #f2ebda; text-shadow: 0 0 30px rgba(196,32,46,.45), 0 4px 0 #000; line-height: 1; }
  .logo .k { color: var(--red); }
  .kanji { font-family: var(--jp); font-weight: 900; }
  .sublogo { font-family: var(--jp); font-size: clamp(16px, 2vw, 24px); letter-spacing: .5em; color: var(--red); margin: 10px 0 4px; }
  .tagline { font-family: var(--serif); font-size: 14px; letter-spacing: .3em; color: #a99f8a; margin-bottom: 34px; text-transform: uppercase; }
  .menu { display: flex; flex-direction: column; gap: 6px; min-width: 320px; }
  .btn { font-family: var(--serif); font-size: 20px; letter-spacing: .14em; padding: 10px 20px 10px 26px; color: #cfc6b2; background: transparent; border: none; border-left: 3px solid transparent; text-align: left; cursor: pointer; text-transform: uppercase; transition: color .12s, background .12s, border-color .12s, padding .12s; position: relative; }
  .btn.focus, .btn:hover { color: #fff; background: linear-gradient(90deg, rgba(196,32,46,.55), rgba(196,32,46,0)); border-left-color: var(--red); padding-left: 34px; }
  .btn.disabled { color: #5d574c; cursor: default; }
  .btn.disabled.focus, .btn.disabled:hover { background: linear-gradient(90deg, rgba(90,90,90,.3), rgba(0,0,0,0)); border-left-color: #555; color: #77705f; }
  .btn .val { float: right; color: var(--gold); margin-left: 24px; }
  .btn .rank { float: right; font-size: 13px; color: var(--gold); margin-left: 24px; letter-spacing: .08em; padding-top: 4px; }
  .btn .num { color: var(--red); margin-right: 12px; font-size: 15px; }
  h2.screen-title { font-family: var(--serif); font-size: 34px; letter-spacing: .2em; margin: 0 0 6px; color: #f0e8d6; text-transform: uppercase; }
  .screen-sub { font-family: var(--jp); color: var(--red); letter-spacing: .4em; margin-bottom: 22px; }
  .hint { position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; color: #8d8574; letter-spacing: .08em; }
  .hint .g { margin: 0 4px 0 14px; }

  #briefing .panel { max-width: 640px; }
  #briefText { font-size: 16px; line-height: 1.6; color: #d8d0bd; margin: 4px 0 18px; max-width: 600px; }
  #briefLoc { font-family: var(--serif); color: var(--gold); letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
  #loadout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 18px; }
  #loadout .btn { font-size: 14px; padding: 8px 10px; border: 1px solid #3a352d; border-left-width: 3px; text-align: center; }
  #loadout .btn .kanji { display: block; font-size: 24px; color: #8f8778; letter-spacing: 0; }
  #loadout .btn.on { border-color: var(--red); color: #fff; background: rgba(196,32,46,.22); }
  #loadout .btn.on .kanji { color: var(--red); }
  #loadNote { font-size: 13px; color: #8d8574; margin-bottom: 8px; letter-spacing: .05em; }

  #resultsPanel { text-align: center; }
  #rankKanji { font-family: var(--jp); font-size: 110px; color: var(--red); line-height: 1; text-shadow: 0 0 40px rgba(196,32,46,.5); }
  #rankName { font-family: var(--serif); font-size: 34px; letter-spacing: .25em; margin: 6px 0 20px; text-transform: uppercase; }
  #stats { margin: 0 auto 24px; border-collapse: collapse; font-size: 16px; }
  #stats td { padding: 4px 18px; border-bottom: 1px solid #2a2620; }
  #stats td:first-child { text-align: left; color: #a99f8a; }
  #stats td:last-child { text-align: right; color: #fff; }
  #results .menu, #gameover .menu { align-items: center; }

  #controlsTable { border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
  #controlsTable th { font-family: var(--serif); color: var(--gold); text-align: left; padding: 6px 14px; letter-spacing: .1em; }
  #controlsTable td { padding: 5px 14px; border-bottom: 1px solid #241f1a; }
  #controlsTable td:first-child { color: #a99f8a; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hpWrap { position: absolute; top: 26px; left: 30px; width: 300px; }
  #hpName { font-family: var(--serif); font-size: 15px; letter-spacing: .3em; color: #e9e2d0; text-shadow: 0 2px 4px #000; margin-bottom: 5px; }
  #hpName .kanji { color: var(--red); margin-right: 8px; letter-spacing: 0; }
  #hpBar { position: relative; height: 9px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.18); transform: skewX(-20deg); overflow: hidden; }
  #hpLag, #hpFill { position: absolute; top: 0; bottom: 0; left: 0; }
  #hpLag { background: #e9e2d0; opacity: .5; }
  #hpFill { background: linear-gradient(180deg, #e33241, #8e1420); }

  #compass { position: absolute; top: 18px; left: 50%; width: 460px; margin-left: -230px; height: 30px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  #compassStrip { position: absolute; top: 0; left: 0; height: 100%; white-space: nowrap; }
  #compass .tick { position: absolute; top: 4px; width: 1px; height: 7px; background: rgba(255,255,255,.4); }
  #compass .lbl { position: absolute; top: 9px; font-family: var(--serif); font-size: 13px; color: #e9e2d0; transform: translateX(-50%); text-shadow: 0 1px 3px #000; }
  #compass .lbl.n { color: var(--red); font-weight: 700; }
  #compassObj { position: absolute; top: 1px; color: var(--gold); font-size: 16px; transform: translateX(-50%); text-shadow: 0 0 6px #000; }
  #compassLine { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.5); }

  #objective { position: absolute; top: 26px; right: 30px; text-align: right; max-width: 340px; }
  #objective .lbl { font-family: var(--serif); font-size: 11px; letter-spacing: .3em; color: var(--gold); }
  #objText { font-size: 15px; color: #f0e8d6; text-shadow: 0 2px 4px #000; margin-top: 3px; }

  #ki { position: absolute; left: 30px; bottom: 30px; width: 104px; height: 104px; }
  #ki svg { position: absolute; inset: 0; }
  #kiNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 30px; font-weight: 700; color: #e9e2d0; text-shadow: 0 2px 6px #000; }
  #kiIcon { position: absolute; top: -8px; right: -6px; font-family: var(--serif); font-size: 34px; font-weight: 900; text-shadow: 0 2px 6px #000; }
  #ki .lbl { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-family: var(--jp); font-size: 12px; color: #a99f8a; letter-spacing: .4em; }

  #itemBox { position: absolute; right: 30px; bottom: 30px; width: 180px; text-align: right; }
  #itemKanji { font-family: var(--jp); font-size: 38px; color: var(--red); line-height: 1; text-shadow: 0 2px 8px #000; }
  #itemName { font-family: var(--serif); font-size: 15px; letter-spacing: .15em; color: #e9e2d0; text-shadow: 0 2px 4px #000; text-transform: uppercase; }
  #itemCount { font-family: var(--serif); font-size: 22px; color: var(--gold); }
  #itemHint { font-size: 11px; color: #8d8574; margin-top: 2px; }

  #prompts { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); display: flex; gap: 22px; }
  .prompt { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 15px; letter-spacing: .1em; color: #f0e8d6; text-shadow: 0 2px 4px #000; text-transform: uppercase; animation: pIn .18s ease-out; }
  @keyframes pIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .g { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; font-family: var(--ui); font-size: 13px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); border: 1.5px solid rgba(255,255,255,.65); }
  .g.k { border-radius: 4px; font-size: 11px; }
  .g.x { color: #7fb2ff; border-color: #7fb2ff; font-size: 15px; }
  .g.o { color: #ff7a7a; border-color: #ff7a7a; font-size: 15px; }
  .g.s { color: #f7a3e0; border-color: #f7a3e0; font-size: 14px; }
  .g.t { color: #6be3b0; border-color: #6be3b0; font-size: 13px; }

  #center { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-family: var(--serif); font-size: 46px; letter-spacing: .25em; color: #f0e8d6; text-shadow: 0 0 30px rgba(0,0,0,.9), 0 3px 0 #000; opacity: 0; transition: opacity .5s; text-transform: uppercase; }
  #center small { display: block; font-size: 16px; letter-spacing: .3em; color: var(--gold); margin-top: 8px; }
  #subtitle { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); max-width: 70%; text-align: center; font-size: 19px; color: #fff; text-shadow: 0 2px 4px #000, 0 0 12px #000; opacity: 0; transition: opacity .3s; }
  #subtitle b { color: var(--gold); font-family: var(--serif); letter-spacing: .1em; margin-right: 8px; }
  #stealthKanji { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.6); font-family: var(--jp); font-weight: 900; font-size: 150px; color: var(--red); text-shadow: 0 0 40px rgba(0,0,0,.9); opacity: 0; transition: opacity .25s, transform .5s cubic-bezier(.2,.9,.3,1); writing-mode: vertical-rl; letter-spacing: .1em; }
  #stealthKanji.on { opacity: .92; transform: translate(-50%, -50%) scale(1); }

  #waypoint { position: absolute; transform: translate(-50%, -100%); color: var(--gold); font-size: 22px; text-align: center; text-shadow: 0 0 6px #000; }
  #waypoint span { display: block; font-family: var(--serif); font-size: 12px; color: #f0e8d6; }
  #lockRet { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid var(--red); transform: rotate(45deg); box-shadow: 0 0 10px rgba(196,32,46,.7); }
  #grappleRet { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 8px rgba(255,255,255,.6); }
  #grappleRet::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: #fff; border-radius: 50%; }
  #grappleRet.far { border-color: rgba(255,255,255,.35); box-shadow: none; }
  #grappleRet .g { position: absolute; left: 40px; top: 3px; }
  .ind { position: absolute; transform: translate(-50%, -100%); font-family: var(--serif); font-weight: 900; font-size: 30px; text-shadow: 0 0 8px #000, 0 2px 0 #000; }
  .ind.q { color: #f2d24b; }
  .ind.e { color: #ff3344; }
  .ind.z { color: #9fb7ff; font-size: 18px; }
  .ind.p { color: #8fe36b; font-size: 18px; }
  #detArcs { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .arc { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%; border: 5px solid transparent; border-top-color: #fff; }
  #bossBar { position: absolute; bottom: 110px; left: 50%; width: 520px; margin-left: -260px; text-align: center; }
  #bossName { font-family: var(--serif); letter-spacing: .3em; font-size: 15px; color: #f0e8d6; text-shadow: 0 2px 4px #000; margin-bottom: 4px; text-transform: uppercase; }
  #bossBar .bar { height: 7px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); }
  #bossFill { height: 100%; background: linear-gradient(180deg, #e33241, #8e1420); width: 100%; transition: width .2s; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(150,0,10,.75) 100%); opacity: 0; }
  #senseVig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,30,.7) 100%); opacity: 0; transition: opacity .3s; }
  #toast { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-family: var(--serif); letter-spacing: .15em; font-size: 15px; color: var(--gold); text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity .3s; text-transform: uppercase; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 30; opacity: 0; transition: opacity .6s; }
  #fpsBox { position: fixed; right: 6px; top: 4px; font: 11px monospace; color: #6a6; z-index: 40; }
  #loading .bar { width: 260px; height: 2px; background: #222; margin-top: 30px; }
  #loading .bar div { height: 100%; width: 0; background: var(--red); transition: width .2s; }
  #loadtxt { margin-top: 12px; font-family: var(--serif); letter-spacing: .25em; font-size: 13px; color: #8d8574; text-transform: uppercase; }
  #clickToPlay { position: fixed; bottom: 40%; left: 0; right: 0; text-align: center; z-index: 25; font-family: var(--serif); letter-spacing: .25em; color: #fff; text-shadow: 0 2px 6px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="senseVig"></div>
  <div id="vignette"></div>
  <div id="hpWrap"><div id="hpName"><span class="kanji">力</span>RIKIMARU</div><div id="hpBar"><div id="hpLag"></div><div id="hpFill"></div></div></div>
  <div id="compass"><div id="compassStrip"></div><div id="compassObj">◆</div><div id="compassLine"></div></div>
  <div id="objective"><div class="lbl">OBJECTIVE</div><div id="objText"></div></div>
  <div id="ki">
    <svg viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="44" fill="rgba(0,0,0,.45)" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
      <circle id="kiRing" cx="52" cy="52" r="44" fill="none" stroke="#e9e2d0" stroke-width="5" stroke-dasharray="276.5" stroke-dashoffset="276.5" transform="rotate(-90 52 52)" stroke-linecap="round"/>
    </svg>
    <div id="kiNum">0</div><div id="kiIcon"></div><div class="lbl">気</div>
  </div>
  <div id="itemBox"><div id="itemKanji"></div><div id="itemName"></div><div id="itemCount"></div><div id="itemHint"></div></div>
  <div id="indicators"></div>
  <div id="detArcs"></div>
  <div id="waypoint" class="hidden">◆<span id="wpDist"></span></div>
  <div id="lockRet" class="hidden"></div>
  <div id="grappleRet" class="hidden"></div>
  <div id="prompts"></div>
  <div id="subtitle"></div>
  <div id="center"></div>
  <div id="stealthKanji">忍殺</div>
  <div id="bossBar" class="hidden"><div id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="toast"></div>
</div>

<!-- ================= Screens ================= -->
<div id="loading" class="screen dim">
  <div class="logo">KATANA <span class="k">CREED</span></div>
  <div class="bar"><div id="loadBar"></div></div>
  <div id="loadtxt">Forging steel</div>
</div>

<div id="mainMenu" class="screen side hidden" data-menu>
  <div class="logo">KATANA <span class="k">CREED</span></div>
  <div class="sublogo kanji">天 誅 ・ 刀 の 信 条</div>
  <div class="tagline">Stealth Assassins, reforged</div>
  <div class="menu">
    <button class="btn" data-act="missions">Missions</button>
    <button class="btn" data-act="ninja" data-lr="1">Ninja <span class="val" id="ninjaVal">◂ Rikimaru ▸</span></button>
    <button class="btn" data-act="controls">Controls</button>
    <button class="btn" data-act="settings">Settings</button>
  </div>
  <div class="hint" id="menuHint"></div>
</div>

<div id="missionMenu" class="screen side hidden" data-menu data-back="main">
  <h2 class="screen-title">Missions</h2>
  <div class="screen-sub kanji">任 務</div>
  <div class="menu" id="missionList"></div>
  <div class="hint" id="missionHint"></div>
</div>

<div id="briefing" class="screen side hidden" data-menu data-back="missions">
  <div class="panel">
    <div id="briefLoc"></div>
    <h2 class="screen-title" id="briefTitle"></h2>
    <div id="briefText"></div>
    <div id="loadNote">Choose up to 4 tools to carry. Grappling hook is always equipped.</div>
    <div id="loadout"></div>
    <div class="menu">
      <button class="btn" data-act="begin">Begin mission</button>
      <button class="btn" data-act="back">Back</button>
    </div>
  </div>
</div>

<div id="pauseMenu" class="screen dim hidden" data-menu data-back="resume">
  <h2 class="screen-title">Paused</h2>
  <div class="screen-sub kanji">休 止</div>
  <div class="menu">
    <button class="btn" data-act="resume">Resume</button>
    <button class="btn" data-act="restart">Restart mission</button>
    <button class="btn" data-act="controls">Controls</button>
    <button class="btn" data-act="settings">Settings</button>
    <button class="btn" data-act="quit">Abandon mission</button>
  </div>
</div>

<div id="controlsMenu" class="screen dim hidden" data-menu data-back="prev">
  <h2 class="screen-title">Controls</h2>
  <table id="controlsTable"></table>
  <div class="menu"><button class="btn" data-act="back">Back</button></div>
</div>

<div id="settingsMenu" class="screen dim hidden" data-menu data-back="prev">
  <h2 class="screen-title">Settings</h2>
  <div class="menu">
    <button class="btn" data-act="quality" data-lr="1">Graphics <span class="val" id="qualityVal"></span></button>
    <button class="btn" data-act="sens" data-lr="1">Camera speed <span class="val" id="sensVal"></span></button>
    <button class="btn" data-act="invert" data-lr="1">Invert camera Y <span class="val" id="invertVal"></span></button>
    <button class="btn" data-act="music" data-lr="1">Music <span class="val" id="musicVal"></span></button>
    <button class="btn" data-act="unlock">Unlock all missions</button>
    <button class="btn" data-act="back">Back</button>
  </div>
</div>

<div id="results" class="screen dim hidden" data-menu>
  <div id="resultsPanel">
    <div class="screen-sub kanji" style="margin:0">任 務 完 了</div>
    <h2 class="screen-title">Mission complete</h2>
    <div id="rankKanji"></div>
    <div id="rankName"></div>
    <table id="stats"></table>
  </div>
  <div class="menu">
    <button class="btn" data-act="next" id="nextBtn">Next mission</button>
    <button class="btn" data-act="restart">Replay</button>
    <button class="btn" data-act="quit">Mission select</button>
  </div>
</div>

<div id="gameover" class="screen dim hidden" data-menu>
  <div class="kanji" style="font-size:90px;color:var(--red)">死</div>
  <h2 class="screen-title">You have fallen</h2>
  <div class="screen-sub" id="goReason" style="font-family:var(--ui);letter-spacing:.1em;color:#a99f8a"></div>
  <div class="menu">
    <button class="btn" data-act="restart">Try again</button>
    <button class="btn" data-act="quit">Mission select</button>
  </div>
</div>

<div id="clickToPlay" class="hidden">Click to take control</div>
<div id="fade"></div>
<div id="fpsBox" class="hidden"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

// height fog: mist pools below the viewer and thins out higher up (works for every built-in material)
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
  varying float vFogDepth; varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vFogDepth = - mvPosition.z; vFogWorld = ( inverse( viewMatrix ) * mvPosition ).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogWorld;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogHk = exp( - max( vFogWorld.y - ( cameraPosition.y - 2.5 ), 0.0 ) * 0.08 );

// a row of town houses along a street segment; side = +1/-1 picks the side of the line
function houseRow(W, x0, z0, x1, z1, side = 1, o = {}) {
  const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz), ux = dx / L, uz = dz / L;
  const nx = -uz * side, nz = ux * side; // toward the houses
  const rot = Math.atan2(-nx, -nz);      // front (+z local) faces the street
  let t = o.start || 0; const out = [];
  while (t < L - 4) {
    const w = rand(o.wMin || 6, o.wMax || 10); if (t + w > L - (o.endPad || 0)) break;
    const d = rand(o.dMin || 6, o.dMax || 8), sb = o.setback || 1;
    const cx = x0 + ux * (t + w / 2) + nx * (d / 2 + sb), cz = z0 + uz * (t + w / 2) + nz * (d / 2 + sb);
    if (!o.skip || !o.skip(cx, cz)) {

      W.house(cx, cz, w, d, rot, { tiers: two ? 2 : 1, lit: rand() < (o.lit !== undefined ? o.lit : 0.5), lanternChance: o.lanternChance !== undefined ? o.lanternChance : 0.35 });
      out.push([cx, cz]);

      if (rand() < 0.15) W.crate(x0 + ux * (t + 1) + nx * (sb - 0.2), z0 + uz * (t + 1) + nz * (sb - 0.2), 0.9, rot);

    const cuts = gaps.filter(g => g[0] === side).map(g => [g[1] - g[2] / 2, g[1] + g[2] / 2]).sort((a, b) => a[0] - b[0]);

    if (id) { $('itemKanji').textContent = ITEMS[id].kanji; $('itemName').textContent = ITEMS[id].name; $('itemCount').textContent = '× ' + (p.items[id] || 0); $('itemHint').innerHTML = `${glyph('prevItem')} ${glyph('nextItem')} switch · ${glyph('item')} use`; }
    else { $('itemKanji').textContent = ''; $('itemName').textContent = 'No items'; $('itemCount').textContent = ''; $('itemHint').textContent = ''; }
    // prompts
    let pr = '';
    if (this.canControl() && !p.dead) {
      if (p.skTarget && p.mode === 'move') pr += `<div class="prompt">${glyph('attack')} Stealth kill</div>`;
      else if (!p.grounded && p.mode === 'move' && this.findAirKillTarget(p)) pr += `<div class="prompt">${glyph('attack')} Air assassination</div>`;
      if (this.nearInteract && p.mode === 'move') pr += `<div class="prompt">${glyph('item')} ${this.nearInteract.text}</div>`;
      if (p.mode === 'climb') pr += `<div class="prompt">${glyph('jump')} Leap / jump off</div><div class="prompt">${glyph('crouch')} Drop</div>`;
      if (p.atEdge && p.grounded && !p.crouch) pr += `<div class="prompt">${glyph('jump')} Jump down</div>`;
    }
    if (pr !== this._pr) { $('prompts').innerHTML = pr; this._pr = pr; }
    // compass
    const cw = 460, k = cw / (PI * 1.1);
    let strip = '';
    const dirs = [['N', PI], ['NE', PI * 0.75], ['E', PI / 2], ['SE', PI / 4], ['S', 0], ['SW', -PI / 4], ['W', -PI / 2], ['NW', -PI * 0.75]];
    for (const [n, a] of dirs) { const off = angWrap(a - this.cam.yaw); if (Math.abs(off) > PI * 0.6) continue; const x = cw / 2 - off * k; strip += `<div class="lbl ${n === 'N' ? 'n' : ''}" style="left:${x}px">${n}</div>`; }
    for (let i = 0; i < 24; i++) { const a = i / 24 * TAU - PI; const off = angWrap(a - this.cam.yaw); if (Math.abs(off) > PI * 0.6) continue; strip += `<div class="tick" style="left:${cw / 2 - off * k}px"></div>`; }
    if (strip !== this._cs) { $('compassStrip').innerHTML = strip; this._cs = strip; }
    const op = this.objPos(), co = $('compassObj'), wp = $('waypoint');
    if (op && !this.ending) {
      const a = yawTo(p.pos.x, p.pos.z, op.x, op.z), off = angWrap(a - this.cam.yaw);
      co.style.display = ''; co.style.left = clamp(cw / 2 - off * k, 8, cw - 8) + 'px';
      const sp = op.clone(); sp.y += 2.2; sp.project(camera);
      const d = p.pos.distanceTo(op);
      if (sp.z < 1 && Math.abs(sp.x) < 1.1 && Math.abs(sp.y) < 1.1 && d > 3) { wp.classList.remove('hidden'); wp.style.left = ((sp.x + 1) / 2 * innerWidth) + 'px'; wp.style.top = ((1 - sp.y) / 2 * innerHeight) + 'px'; $('wpDist').textContent = Math.round(d) + 'm'; wp.style.opacity = this.senseAmt > 0.5 ? 1 : clamp(d / 25, 0.35, 0.9); }
      else wp.classList.add('hidden');
    } else { co.style.display = 'none'; wp.classList.add('hidden'); }
    // enemy indicators
    const ind = $('indicators'); if (!this._ind) { this._ind = []; for (let i = 0; i < 24; i++) { const d = document.createElement('div'); d.className = 'ind'; ind.appendChild(d); this._ind.push(d); } }
    let ii = 0;
    for (const e of W.enemies) {
      if (ii >= 24) break; if (e.dead || !e.icon) continue;
      if (e.icon === '*' && e.state !== 'stunned') continue;
      const d = e.pos.distanceTo(p.pos); if (d > 40) continue;
      const v = e.headPos(new THREE.Vector3()); v.y += 0.45; v.project(camera); if (v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05) continue;
      const el = this._ind[ii++]; el.style.display = ''; el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
      el.className = 'ind ' + (e.icon === '!' ? 'e' : e.icon === '?' ? 'q' : e.icon === 'z' ? 'z' : 'p'); el.textContent = e.icon === 'z' ? 'z z' : e.icon === '*' ? '✶' : e.icon;
    }
    for (; ii < 24; ii++) this._ind[ii].style.display = 'none';
    // detection arcs (AC-style)
    const arcs = $('detArcs'); if (!this._arcs) { this._arcs = []; for (let i = 0; i < 8; i++) { const d = document.createElement('div'); d.className = 'arc'; arcs.appendChild(d); this._arcs.push(d); } }
    let ai = 0;
    for (const e of W.enemies) {
      if (ai >= 8) break; if (e.dead || e.harmless || e.state === 'alert' || e.aw < 0.06) continue;
      const a = angWrap(yawTo(p.pos.x, p.pos.z, e.pos.x, e.pos.z) - this.cam.yaw);
      const el = this._arcs[ai++]; el.style.display = ''; const c = clamp(e.aw, 0, 1);
      el.style.transform = `rotate(${-a}rad)`; el.style.opacity = 0.3 + c * 0.7;
      el.style.borderTopColor = `rgb(255,${Math.round(240 - c * 200)},${Math.round(200 - c * 190)})`;
    }
    for (; ai < 8; ai++) this._arcs[ai].style.display = 'none';
    // lock-on reticle
    const lr = $('lockRet');
    if (p.lock && Input.held.lock && !p.lock.dead) { const v = p.lock.chestPos(new THREE.Vector3()).project(camera); lr.classList.remove('hidden'); lr.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; lr.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; } else lr.classList.add('hidden');
    // grapple reticle
    const gr = $('grappleRet');
    if (p.anchorTarget && (p.mode === 'move' || p.mode === 'climb') && this.canControl()) {
      const v = p.anchorTarget.pos.clone().project(camera); gr.classList.remove('hidden'); gr.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; gr.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
      const gh = glyph('grapple'); if (gr._g !== gh) { gr.innerHTML = gh; gr._g = gh; }
    } else gr.classList.add('hidden');
    // overlays
    this.hurtFlash = Math.max(0, (this.hurtFlash || 0) - dt * 1.5);
    $('vignette').style.opacity = Math.max(this.hurtFlash * 0.8, hp < 0.3 ? 0.35 + Math.sin(this.time * 5) * 0.1 : 0);
    $('senseVig').style.opacity = this.senseAmt;
    this.updateSubtitles(dt);
  },
  // ---------------- screens ----------------
  showResults() {
    this.state = 'results'; Input.unlockPointer();
    const r = this.rank(), s = this.stats, L = this.level;
    $('rankKanji').textContent = r.kanji; $('rankName').textContent = r.name;
    const mm = Math.floor(s.time / 60), ss = Math.floor(s.time % 60).toString().padStart(2, '0');
    $('stats').innerHTML = [['Stealth kills', s.stealth], ['Enemies killed', s.kills], ['Times detected', s.detected], ['Innocents killed', s.civilians], ['Damage taken', Math.round(s.hurt)], ['Time', `${mm}:${ss}`]].map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
    const best = Save.data.best[L.id], order = ['Thug', 'Novice', 'Ninja', 'Master Ninja', 'Grand Master'];
    if (!best || order.indexOf(r.name) > order.indexOf(best)) Save.data.best[L.id] = r.name;
    Save.data.unlocked = Math.max(Save.data.unlocked, this.levelIdx + 2); Save.store();
    $('nextBtn').classList.toggle('disabled', this.levelIdx + 1 >= LEVELS.length);
    $('nextBtn').textContent = this.levelIdx + 1 >= LEVELS.length ? 'The end' : 'Next mission';
    $('hud').classList.add('hidden'); UI.show('results');
    SFX.setAmbience(false);
  },
  showGameOver(reason) { this.state = 'gameover'; Input.unlockPointer(); $('goReason').textContent = reason; $('hud').classList.add('hidden'); UI.show('gameover'); },
};

// =====================================================================
//  Menus
// =====================================================================
const UI = {
  cur: null, focus: 0, prevMenu: null,
  screens: ['mainMenu', 'missionMenu', 'briefing', 'pauseMenu', 'controlsMenu', 'settingsMenu', 'results', 'gameover'],
  hideAll() { for (const s of this.screens) $(s).classList.add('hidden'); this.cur = null; $('loading').classList.add('hidden'); },
  show(id) {
    if (this.cur && this.cur !== id && id !== 'controlsMenu' && id !== 'settingsMenu') this.prevMenu = this.cur;
    if (id === 'controlsMenu' || id === 'settingsMenu') this.backTo = this.cur;
    this.hideAll(); this.cur = id; $(id).classList.remove('hidden'); this.focus = 0;
    if (id === 'missionMenu') this.buildMissions();
    if (id === 'settingsMenu') this.refreshSettings();
    if (id === 'controlsMenu') this.buildControls();
    if (id === 'mainMenu') this.refreshMain();
    this.updateFocus(); this.refreshHints(); this.updateClickToPlay();
  },
  buttons() { return this.cur ? [...$(this.cur).querySelectorAll('.btn')] : []; },
  updateFocus() { const b = this.buttons(); b.forEach((x, i) => x.classList.toggle('focus', i === this.focus)); },
  input() {
    if (!this.cur) return;
    const b = this.buttons(); if (!b.length) return;
    const I = Input;
    const up = I.pressed.up || I.navStick === 1, down = I.pressed.down || I.navStick === 2, left = (I.pressed.left || I.navStick === 3), right = (I.pressed.right || I.navStick === 4);
    const grid = this.cur === 'briefing', NI = ITEM_KEYS.length;
    if (up) {
      if (grid) this.focus = this.focus >= 3 && this.focus < NI ? this.focus - 3 : this.focus === NI ? NI - 3 : this.focus < 3 ? b.length - 1 : this.focus - 1;
      else this.focus = (this.focus - 1 + b.length) % b.length;
      SFX.ui(); this.updateFocus();
    }
    if (down) {
      if (grid) this.focus = this.focus < NI - 3 ? this.focus + 3 : this.focus < NI ? NI : (this.focus + 1) % b.length;
      else this.focus = (this.focus + 1) % b.length;
      SFX.ui(); this.updateFocus();
    }
    const fb = b[this.focus];
    if ((left || right) && fb) {
      if (fb.dataset.lr) { this.act(fb.dataset.act, right ? 1 : -1); }
      else if (grid && this.focus < ITEM_KEYS.length) { this.focus = clamp(this.focus + (right ? 1 : -1), 0, ITEM_KEYS.length - 1); SFX.ui(); this.updateFocus(); }
    }
    if (I.pressed.confirm && fb && !fb.classList.contains('disabled')) { SFX.uiOk(); this.act(fb.dataset.act, 1, fb); }
    else if (I.pressed.back && !I.pressed.confirm) { const bk = $(this.cur).dataset.back; if (bk) { SFX.ui(); this.act(bk === 'prev' ? 'back' : bk === 'main' ? 'toMain' : bk); } }
  },
  act(a, dir = 1, el) {
    switch (a) {
      case 'missions': this.show('missionMenu'); break;
      case 'ninja': Save.data.ninja = Save.data.ninja === 'rikimaru' ? 'ayame' : 'rikimaru'; Save.store(); this.refreshMain(); Title.setNinja(Save.data.ninja); SFX.ui(); break;
      case 'controls': this.show('controlsMenu'); break;
      case 'settings': this.show('settingsMenu'); break;
      case 'toMain': this.show('mainMenu'); break;
      case 'mission': { const i = +el.dataset.i; if (i < Save.data.unlocked) { this.briefIdx = i; this.show('briefing'); this.buildBriefing(); } break; }
      case 'item': { const id = el.dataset.id, lo = Save.data.loadout; const k = lo.indexOf(id); if (k >= 0) lo.splice(k, 1); else if (lo.length < 4) lo.push(id); else { lo.shift(); lo.push(id); } Save.store(); this.buildBriefing(true); break; }
      case 'begin': Title.stop(); Game.startLevel(this.briefIdx); break;
      case 'missionsBack': case 'back':
        if (this.cur === 'controlsMenu' || this.cur === 'settingsMenu') { this.show(this.backTo || 'mainMenu'); }
        else if (this.cur === 'briefing') this.show('missionMenu');
        break;
      case 'resume': UI.hideAll(); Game.state = 'play'; $('hud').classList.remove('hidden'); this.updateClickToPlay(); break;
      case 'restart': Game.startLevel(Game.levelIdx); break;
      case 'quit': Game.clearWorld(); $('hud').classList.add('hidden'); Game.state = 'menu'; Title.start(); this.show('missionMenu'); break;
      case 'next': if (Game.levelIdx + 1 < LEVELS.length) { this.briefIdx = Game.levelIdx + 1; Game.clearWorld(); Game.state = 'menu'; Title.start(); this.show('briefing'); this.buildBriefing(); } break;
      case 'quality': quality = Save.data.quality = quality === 'high' ? 'low' : 'high'; Save.store(); setupComposer(); this.refreshSettings(); break;
      case 'sens': Save.data.sens = clamp(Math.round((Save.data.sens + dir * 0.1) * 10) / 10, 0.3, 2.5); Save.store(); this.refreshSettings(); break;
      case 'invert': Save.data.invert = !Save.data.invert; Save.store(); this.refreshSettings(); break;
      case 'music': Save.data.music = !Save.data.music; Save.store(); SFX.setMusic(Save.data.music); this.refreshSettings(); break;
      case 'unlock': Save.data.unlocked = LEVELS.length; Save.store(); Game.toast('All missions unlocked'); SFX.uiOk(); break;
    }
  },
  refreshMain() { $('ninjaVal').textContent = '◂ ' + NINJAS[Save.data.ninja].name + ' ▸'; },
  refreshSettings() { $('qualityVal').textContent = quality === 'high' ? 'High' : 'Low'; $('sensVal').textContent = Save.data.sens.toFixed(1); $('invertVal').textContent = Save.data.invert ? 'On' : 'Off'; $('musicVal').textContent = Save.data.music ? 'On' : 'Off'; },
  buildMissions() {
    $('missionList').innerHTML = LEVELS.map((L, i) => {
      const locked = i >= Save.data.unlocked;
      return `<button class="btn ${locked ? 'disabled' : ''}" data-act="mission" data-i="${i}"><span class="num">${L.num === 0 ? '修' : String(L.num).padStart(2, '0')}</span>${locked ? '— locked —' : L.title}${Save.data.best[L.id] ? `<span class="rank">${Save.data.best[L.id]}</span>` : ''}</button>`;
    }).join('') + `<button class="btn" data-act="toMain">Back</button>`;
    this.bindButtons();
    this.focus = Math.min(Save.data.unlocked - 1, LEVELS.length - 1); this.updateFocus();
  },
  buildBriefing(keepFocus) {
    const L = LEVELS[this.briefIdx];
    $('briefLoc').textContent = L.loc; $('briefTitle').textContent = L.title; $('briefText').innerHTML = L.brief;
    $('loadout').innerHTML = ITEM_KEYS.map(id => `<button class="btn ${Save.data.loadout.includes(id) ? 'on' : ''}" data-act="item" data-id="${id}"><span class="kanji">${ITEMS[id].kanji}</span>${ITEMS[id].name} ×${ITEMS[id].count}</button>`).join('');
    this.bindButtons();
    if (!keepFocus) this.focus = ITEM_KEYS.length; this.updateFocus();
  },
  buildControls() {
    const rows = [['Move', 'WASD', 'Left stick'], ['Camera', 'Mouse', 'Right stick'], ['Sprint / free-run (auto vault, climb, leap)', 'Shift (hold)', 'R2 (hold)'], ['Jump · climb · leap from walls', 'Space', '✕'], ['Attack · stealth kill · air kill', 'Left click', '□'],
      ['Crouch (sneak) · drop from wall', 'C / Ctrl', '○'], ['Lock-on & block (tap to parry)', 'Right click (hold)', 'L1 (hold)'], ['Dodge roll (while locked)', 'C + direction', '○ + direction'], ['Grappling hook (aim at ◯ marker)', 'E', 'R1'],
      ['Use item · interact', 'F', '△'], ['Switch item', 'Q / R · wheel', 'D-pad ◀ ▶'], ['Ki sense (see foes through walls)', 'Tab (hold)', 'L2 (hold)'], ['Recenter camera', 'V / middle click', 'R3'], ['Pause', 'Esc / P', 'Options']];
    $('controlsTable').innerHTML = `<tr><th>Action</th><th>Keyboard &amp; mouse</th><th>Gamepad (PS)</th></tr>` + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  },
  bindButtons() { for (const s of this.screens) for (const b of $(s).querySelectorAll('.btn')) if (!b._bound) { b._bound = true; b.addEventListener('click', () => { if (b.classList.contains('disabled')) return; SFX.init(); SFX.uiOk(); this.act(b.dataset.act, 1, b); }); b.addEventListener('mouseenter', () => { const i = this.buttons().indexOf(b); if (i >= 0 && i !== this.focus) { this.focus = i; this.updateFocus(); } }); } },
  refreshHints() {
    const h = `${glyph('confirm')} Select ${glyph('back')} Back` + (Input.device === 'pad' ? '' : ' · Arrow keys / mouse to navigate');
    for (const id of ['menuHint', 'missionHint']) $(id).innerHTML = h;
  },
  updateClickToPlay() { $('clickToPlay').classList.toggle('hidden', !(Game.state === 'play' && !this.cur && !Input.locked && Input.device === 'kb')); }
};
const ITEM_KEYS = Object.keys(ITEMS);

// =====================================================================
//  Title screen backdrop (rooftop, moon, chosen ninja)
// =====================================================================
const Title = {
  active: false, ninja: null, t: 0,
  def: {
    id: 'title', size: 90, sky: 'night', seed: 3, mountains: true,
    terrain: (x, z) => fbm(x * 0.05, z * 0.05, 3) * 1.5,
    ground: () => [0.22, 0.24, 0.17],
    build(W) {
      W.house(0, 0, 9, 6, 0, { lit: true, lanternChance: 1 });
      W.house(-11, -6, 8, 6, 0.2, { lit: true });
      W.house(11, -8, 10, 7, -0.15, { tiers: 2, lit: true });
      W.house(-3, -16, 12, 7, 0, { lit: true });
      W.tree(6, 6, 1.1); W.tree(-7, 7, 0.9); W.stoneLantern(3, 5); W.stoneLantern(-3, 5);
      W.wall(-20, 10, 20, 10, {});
      for (let i = 0; i < 12; i++) W.house(rand(-40, 40), rand(-45, -25), rand(6, 10), rand(5, 7), rand(-0.3, 0.3), { lit: rand() < 0.5 });
    }
  },
  start() {
    this.active = true; Game.state = 'menu';
    Game.buildWorld(this.def);
    this.setNinja(Save.data.ninja);
    SFX.menuMusic = true;
  },
  setNinja(key) {
    if (this.ninja) this.ninja.removeFrom(scene);
    const n = this.ninja = new NPC(NINJAS[key], Game.world, {});
    const ridge = Game.world.groundAt(0, 0, 50);
    n.place(0.6, 0, 0.4, ridge); n.addTo(scene);
  },
  stop() { this.active = false; if (this.ninja) { this.ninja.removeFrom(scene); this.ninja = null; } SFX.menuMusic = false; },
  update(dt) {
    if (!this.active || !this.ninja) return;
    this.t += dt;
    this.ninja.update(dt, Game);
    const n = this.ninja, a = Math.sin(this.t * 0.08) * 0.6 + 0.6, r = 3.3;
    camera.position.set(n.pos.x + Math.sin(a) * r, n.pos.y + 1.35 + Math.sin(this.t * 0.2) * 0.15, n.pos.z + Math.cos(a) * r);
    camera.lookAt(n.pos.x - Math.cos(a) * 1.7, n.pos.y + 1.2, n.pos.z + Math.sin(a) * 1.7);
    camFill.position.copy(camera.position); camFill.intensity = 2.2;
    const md = Game.world.sky.moonDir;
    moon.target.position.copy(n.pos); moon.position.set(n.pos.x + md[0] * 60, n.pos.y + md[1] * 60, n.pos.z + md[2] * 60);
    sky.position.copy(camera.position);
    for (const f of Game.world.flames) FX.fire(f.pos, f.s);
  }
};

// =====================================================================
//  Main loop
// =====================================================================
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (window.KC && KC.manual) return;
  tick(dt);
}
function tick(dt, noRender) {
  Input.poll();
  if (Game.state === 'play') {
    if (Input.pressed.pause && !Game.ending) { Game.state = 'paused'; Input.unlockPointer(); UI.show('pauseMenu'); }
    Game.update(dt);
    Game.cam.update(dt * (Game.timeScale < 0.9 ? Math.max(0.5, Game.timeScale) : 1), Game.player, Game);
    Game.updateHUD(dt);
  } else if (Game.state === 'menu' || Game.state === 'paused' || Game.state === 'results' || Game.state === 'gameover') {
    UI.input();
    if (Game.state === 'menu') Title.update(dt);
    if (Game.state === 'paused' && Input.pressed.pause && UI.cur === 'pauseMenu') UI.act('resume');
  }
  if (Game.world) {
    Game.updateLights(dt);
    FX.update(Game.state === 'play' ? dt * Game.timeScale : dt);
    gradePass.uniforms.desat.value = Game.senseAmt * 0.85; gradePass.uniforms.time.value += dt; WIND.value += dt; skyMat.uniforms.time.value += dt;
    if (noRender) return;
    composer.render();
    if (Game.senseAmt > 0.05 && Game.state === 'play') {
      renderer.autoClear = false; camera.layers.set(1); scene.overrideMaterial = xrayMat;
      const fog = scene.fog; scene.fog = null; renderer.render(scene, camera); scene.fog = fog;
      scene.overrideMaterial = null; camera.layers.set(0); renderer.autoClear = true;
    }
  }
  SFX.update(dt, Game.state === 'play');
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { $('fpsBox').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = 0; fpsN = 0; }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); setupComposer(); });
addEventListener('keydown', e => { if (e.code === 'F3') { $('fpsBox').classList.toggle('hidden'); } });
canvas.addEventListener('click', () => { SFX.init(); if (Game.state === 'play' && !UI.cur) { Input.lockPointer(canvas); } });
document.addEventListener('pointerlockchange', () => {
  if (Input.locked) Input.everLocked = true;
  if (!Input.locked && Input.everLocked && Game.state === 'play' && !Game.ending && Input.device === 'kb') { Game.state = 'paused'; UI.show('pauseMenu'); }
  UI.updateClickToPlay();
});
addEventListener('keydown', () => SFX.init(), { once: true });
addEventListener('mousedown', () => SFX.init(), { once: true });

async function boot() {
  Input.init(canvas);
  camera.layers.set(0);
  setupComposer();
  await buildTextures(p => { $('loadBar').style.width = (p * 100) + '%'; });
  TEX.fabric.normal.repeat.set(3, 3);
  buildMaterials();
  FX.init(scene);
  $('loadtxt').textContent = 'Drawing the night';
  await new Promise(r => setTimeout(r, 30));
  Title.start();
  UI.bindButtons();
  $('loading').classList.add('hidden');
  UI.show('mainMenu');
  requestAnimationFrame(frame);
  // debug hooks
  window.KC = { Game, Input, UI, LEVELS, THREE, scene, camera, renderer, Title, NINJAS, NPC, Enemy, SFX, tick, composer: () => composer, buildRig, POSE, newPose };
}
boot();
</script>
