<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soapbox Scramble 64</title>
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcc33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#ffcc33; --red:#ff4b3e; --blue:#2f7bff; --ink:#20140c; --cream:#fff6e0; --green:#38c172;
    --panel:rgba(255,246,224,.94);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fc4ff;color:var(--ink);font-family:Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  .hidden{display:none!important}
  .cartoon{font-family:'Luckiest Guy',Nunito,sans-serif;letter-spacing:.04em;font-weight:400}

  /* ---------- menus ---------- */
  #menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:auto;pointer-events:none}
  #menu > *{pointer-events:auto}
  #menu.dim{background:radial-gradient(ellipse at center,rgba(20,10,0,.15),rgba(20,10,0,.55))}
  .logo{font-family:'Luckiest Guy',sans-serif;text-align:center;line-height:.9;margin:0 0 6px;font-size:clamp(40px,9vw,104px);color:var(--sun);
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.35);transform:rotate(-3deg)}
  .logo small{display:block;font-size:.42em;color:#fff;-webkit-text-stroke:2px var(--ink);transform:rotate(2deg);margin-top:6px}
  .logo .n64{color:var(--red)}
  h2.mtitle{font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:clamp(28px,5vw,54px);margin:0 0 14px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
  .mlist{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(340px,90vw)}
  .mrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:960px}
  .btn{font-family:'Luckiest Guy',sans-serif;font-size:clamp(18px,2.6vw,26px);letter-spacing:.05em;color:var(--ink);background:var(--cream);border:4px solid var(--ink);
    border-radius:16px;padding:10px 22px 6px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,background .1s;position:relative;text-align:center}
  .btn:hover,.btn.focus{background:var(--sun);transform:translateY(-2px) rotate(-1deg)}
  .btn.focus::after{content:'';position:absolute;inset:-9px;border:3px dashed #fff;border-radius:20px;pointer-events:none}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .btn.locked{opacity:.55;filter:grayscale(.8)}
  .btn .sub{display:block;font-family:Nunito,sans-serif;font-weight:800;font-size:.55em;letter-spacing:0;opacity:.75;margin-top:2px}
  .btn.small{font-size:16px;padding:7px 14px 4px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
  .panel{background:var(--panel);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:14px 18px}
  .hint{margin-top:14px;font-weight:800;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);text-align:center;font-size:15px}
  .chargrid{display:grid;grid-template-columns:repeat(4,minmax(0,150px));gap:10px}
  @media (max-width:640px){.chargrid{grid-template-columns:repeat(4,minmax(0,80px))}}
  .cbtn{padding:6px 6px 4px;font-size:clamp(13px,1.8vw,18px)}
  .cbtn .face{display:block;width:100%;aspect-ratio:1;border-radius:10px;margin-bottom:4px;border:3px solid var(--ink)}
  .cbtn .tags{display:flex;gap:4px;justify-content:center;position:absolute;top:-10px;left:0;right:0}
  .ptag{font-family:'Luckiest Guy',sans-serif;font-size:13px;padding:2px 6px 0;border:2px solid var(--ink);border-radius:8px;color:#fff}
  .stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-weight:900;font-size:14px;align-items:center;min-width:220px}
  .bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red)}
  table.res{border-collapse:collapse;font-weight:900;font-size:clamp(14px,2vw,20px)}
  table.res td{padding:4px 12px;border-bottom:2px dashed rgba(0,0,0,.2)}
  table.res tr.me td{background:rgba(255,204,51,.6)}
  table.res td.pos{font-family:'Luckiest Guy',sans-serif;font-size:1.3em}
  .chip{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);vertical-align:-2px;margin-right:6px}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:20px}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:900;box-shadow:0 4px 0 var(--ink)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none}
  .vp{position:absolute;container-type:size;overflow:hidden}
  .vp .tl{position:absolute;left:2cqmin;top:2cqmin;font-family:'Luckiest Guy',sans-serif;color:#fff;-webkit-text-stroke:.5cqmin var(--ink);paint-order:stroke fill;line-height:1}
  .vp .lap{font-size:6.5cqmin}
  .vp .time{font-size:4.6cqmin;margin-top:.8cqmin}
  .vp .laps{font-family:Nunito,sans-serif;font-weight:900;font-size:2.6cqmin;-webkit-text-stroke:0;text-shadow:0 .3cqmin 0 var(--ink);margin-top:.6cqmin}
  .vp .item{position:absolute;right:2cqmin;top:2cqmin;width:15cqmin;height:15cqmin;border:.8cqmin solid var(--ink);border-radius:2.6cqmin;background:rgba(255,246,224,.85);box-shadow:0 .8cqmin 0 var(--ink);display:flex;align-items:center;justify-content:center}
  .vp .item svg{width:85%;height:85%}
  .vp .item .cnt{position:absolute;right:-1cqmin;bottom:-1.5cqmin;font-family:'Luckiest Guy',sans-serif;font-size:5cqmin;color:#fff;-webkit-text-stroke:.5cqmin var(--ink);paint-order:stroke fill}
  .vp .pos{position:absolute;right:3cqmin;bottom:2cqmin;font-family:'Luckiest Guy',sans-serif;font-size:16cqmin;line-height:.8;color:var(--sun);-webkit-text-stroke:.9cqmin var(--ink);paint-order:stroke fill;text-shadow:0 1cqmin 0 var(--ink)}
  .vp .pos sup{font-size:.4em;vertical-align:top}
  .vp .speed{position:absolute;left:2cqmin;bottom:2cqmin;font-family:'Luckiest Guy',sans-serif;font-size:5cqmin;color:#fff;-webkit-text-stroke:.45cqmin var(--ink);paint-order:stroke fill}
  .vp .speed small{font-size:.5em}
  .vp .ranks{position:absolute;left:1.6cqmin;top:22cqmin;display:flex;flex-direction:column;gap:.7cqmin}
  .vp .ranks div{width:5.5cqmin;height:5.5cqmin;border-radius:50%;border:.5cqmin solid var(--ink);font-family:'Luckiest Guy',sans-serif;font-size:3cqmin;display:flex;align-items:center;justify-content:center;color:#fff;-webkit-text-stroke:.3cqmin var(--ink);paint-order:stroke fill;transition:transform .3s}
  .vp .ranks div.me{outline:.6cqmin solid #fff}
  .vp .msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:'Luckiest Guy',sans-serif;font-size:14cqmin;color:var(--sun);-webkit-text-stroke:.9cqmin var(--ink);paint-order:stroke fill;text-shadow:0 1cqmin 0 var(--ink);transform-origin:center;white-space:nowrap}
  .vp .msg.small{font-size:8cqmin;color:#fff}
  .vp .msg.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .vp .balloons{position:absolute;left:2cqmin;top:2cqmin;font-size:7cqmin;display:flex;gap:1cqmin}
  .vp .balloons i{display:block;width:5cqmin;height:6.5cqmin;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;border:.5cqmin solid var(--ink)}
  .vp .flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .4s}
  .vp .ink{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
    background:radial-gradient(circle at 30% 40%,#fff8 0 12%,transparent 13%),radial-gradient(circle at 70% 60%,#fffd 0 16%,transparent 17%),radial-gradient(circle at 50% 30%,#fffa 0 9%,transparent 10%)}
  #minimap{position:absolute;pointer-events:none}
  .divider{position:absolute;background:var(--ink)}

  /* ---------- touch ---------- */
  #touch{position:fixed;inset:0;z-index:8;pointer-events:none}
  #touch .stick{position:absolute;left:4vmin;bottom:4vmin;width:34vmin;height:34vmin;max-width:200px;max-height:200px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(32,20,12,.5);pointer-events:auto}
  #touch .knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,204,51,.85);border:3px solid var(--ink)}
  #touch .tb{position:absolute;width:17vmin;height:17vmin;max-width:96px;max-height:96px;border-radius:50%;border:4px solid var(--ink);background:rgba(255,246,224,.75);font-family:'Luckiest Guy',sans-serif;font-size:min(4.4vmin,22px);display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 4px 0 var(--ink)}
  #touch .tb.on{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  #touch .tpause{top:2vmin;left:50%;transform:translateX(-50%);width:11vmin;height:11vmin;font-size:16px}

  #loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffcc33;font-family:'Luckiest Guy',sans-serif;font-size:30px;color:var(--ink)}
  #loading .wheel{width:70px;height:70px;border-radius:50%;border:8px solid var(--ink);border-top-color:#fff;animation:spin 1s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="touch" class="hidden"></div>
<div id="menu"></div>
<div id="loading"><div class="wheel"></div><div id="loadText">Waxing the soapboxes…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  UTILITIES
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const smooth = t => t * t * (3 - 2 * t);
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fmtTime = t => { if (!isFinite(t)) return '--\'--"--'; const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100); return `${m}'${String(s).padStart(2, '0')}"${String(c).padStart(2, '0')}`; };
const ordinal = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// Value noise for procedural textures.
function makeNoise(seed) {
  const r = rng(seed), P = new Uint8Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const v = (x, y) => G[P[(P[x & 255] + y) & 255]];
  const n = (x, y, per = 256) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = smooth(xf), w = smooth(yf);
    const a = v(xi % per, yi % per), b = v((xi + 1) % per, yi % per), c = v(xi % per, (yi + 1) % per), d = v((xi + 1) % per, (yi + 1) % per);
    return lerp(lerp(a, b, u), lerp(c, d, u), w);
  };
  return (x, y, oct = 4, per = 8) => { let s = 0, a = 0.5, f = 1, tot = 0; for (let o = 0; o < oct; o++) { s += n(x * f, y * f, per * f) * a; tot += a; a *= 0.5; f *= 2; } return s / tot; };
}

// =====================================================================
//  SAVE DATA
// =====================================================================
const SAVE_KEY = 'soapbox-scramble-64';
const save = { best: {}, lap: {}, cups: {}, opts: { quality: 'high', music: 0.55, sfx: 0.8, autoGas: true, ghosts: true } };
try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); Object.assign(save.best, d.best); Object.assign(save.lap, d.lap); Object.assign(save.cups, d.cups); Object.assign(save.opts, d.opts); } catch (e) { }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
function loadGhost(id) { try { const g = JSON.parse(localStorage.getItem(SAVE_KEY + '.ghost.' + id) || 'null'); if (!g) return null; const bin = atob(g.d), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return { char: g.c, time: g.t, f: new Float32Array(u.buffer) }; } catch (e) { return null; } }
function storeGhost(id, char, time, frames) { try { const u = new Uint8Array(frames.buffer); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); localStorage.setItem(SAVE_KEY + '.ghost.' + id, JSON.stringify({ c: char, t: time, d: btoa(s) })); } catch (e) { } }

// =====================================================================
//  AUDIO (all synthesized)
// =====================================================================
const Sound = (() => {
  let ctx = null, master, music, sfx, noiseBuf, comp;
  const init = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    music = ctx.createGain(); music.connect(master); sfx = ctx.createGain(); sfx.connect(master);
    setVolumes();
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  };
  const setVolumes = () => { if (!ctx) return; music.gain.value = save.opts.music * 0.45; sfx.gain.value = save.opts.sfx; };
  const tone = ({ f = 440, f2 = null, t = 0.15, type = 'square', v = 0.15, d = 0, a = 0.005, out = null } = {}) => {
    if (!ctx) return; const t0 = ctx.currentTime + d, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + t);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    o.connect(g); g.connect(out || sfx); o.start(t0); o.stop(t0 + t + 0.05);
  };
  const noise = ({ t = 0.2, v = 0.3, f = 1200, f2 = null, q = 1, type = 'bandpass', d = 0, a = 0.005 } = {}) => {
    if (!ctx) return; const t0 = ctx.currentTime + d, s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + t);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    s.connect(fl); fl.connect(g); g.connect(sfx); s.start(t0, Math.random() * 0.5); s.stop(t0 + t + 0.05);
  };
  const fx = {
    move: () => tone({ f: 660, t: 0.06, v: 0.06, type: 'triangle' }),
    select: () => { tone({ f: 523, t: 0.08, v: 0.1 }); tone({ f: 784, t: 0.12, v: 0.1, d: 0.07 }); },
    back: () => tone({ f: 400, f2: 220, t: 0.12, v: 0.08, type: 'triangle' }),
    beep: hi => tone({ f: hi ? 1046 : 523, t: hi ? 0.6 : 0.25, v: 0.18, type: 'square' }),
    box: () => { tone({ f: 900, f2: 1800, t: 0.12, v: 0.08, type: 'sine' }); noise({ t: 0.15, v: 0.1, f: 5000 }); },
    tick: () => tone({ f: 1400 + Math.random() * 500, t: 0.03, v: 0.04, type: 'square' }),
    got: () => { tone({ f: 784, t: 0.08, v: 0.1 }); tone({ f: 1175, t: 0.18, v: 0.1, d: 0.08 }); },
    throw: () => noise({ t: 0.18, v: 0.18, f: 800, f2: 3000, q: 2 }),
    drop: () => tone({ f: 300, f2: 120, t: 0.15, v: 0.12, type: 'triangle' }),
    hit: () => { noise({ t: 0.35, v: 0.35, f: 600, f2: 150, q: 0.8, type: 'lowpass' }); tone({ f: 220, f2: 60, t: 0.35, v: 0.2, type: 'sawtooth' }); },
    spin: () => { for (let i = 0; i < 4; i++) tone({ f: 700 - i * 90, t: 0.08, v: 0.07, type: 'triangle', d: i * 0.08 }); },
    boom: () => { noise({ t: 0.9, v: 0.6, f: 900, f2: 60, q: 0.5, type: 'lowpass' }); tone({ f: 120, f2: 30, t: 0.8, v: 0.4, type: 'sine' }); },
    boost: () => { noise({ t: 0.6, v: 0.25, f: 400, f2: 2500, q: 1.5 }); tone({ f: 200, f2: 700, t: 0.4, v: 0.1, type: 'sawtooth' }); },
    mini: c => { noise({ t: 0.35, v: 0.18, f: 900, f2: 2600, q: 2 }); tone({ f: c > 1 ? 880 : 660, t: 0.12, v: 0.06, type: 'square' }); },
    spark: () => noise({ t: 0.05, v: 0.05, f: 6000, q: 3 }),
    bump: () => { noise({ t: 0.12, v: 0.2, f: 300, q: 1, type: 'lowpass' }); },
    splat: () => { noise({ t: 0.25, v: 0.3, f: 1500, f2: 300, q: 0.7 }); tone({ f: 180, f2: 90, t: 0.2, v: 0.15, type: 'triangle' }); },
    shrink: () => { for (let i = 0; i < 6; i++) tone({ f: 1600 / (1 + i * 0.35), t: 0.1, v: 0.1, type: 'square', d: i * 0.06 }); noise({ t: 0.5, v: 0.35, f: 3000, f2: 200 }); },
    grow: () => { for (let i = 0; i < 5; i++) tone({ f: 300 * (1 + i * 0.3), t: 0.08, v: 0.07, type: 'square', d: i * 0.05 }); },
    ghost: () => { tone({ f: 600, f2: 300, t: 0.5, v: 0.1, type: 'sine' }); tone({ f: 640, f2: 280, t: 0.55, v: 0.06, type: 'sine', d: 0.05 }); },
    steal: () => { tone({ f: 500, f2: 1500, t: 0.25, v: 0.1, type: 'triangle' }); },
    lap: () => [523, 659, 784, 1046].forEach((f, i) => tone({ f, t: 0.14, v: 0.12, d: i * 0.09, type: 'square' })),
    final: () => [784, 784, 1046, 988, 1175, 1568].forEach((f, i) => tone({ f, t: 0.16, v: 0.13, d: i * 0.11, type: 'square' })),
    finish: () => [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone({ f, t: 0.22, v: 0.14, d: i * 0.13, type: i % 2 ? 'square' : 'triangle' })),
    lose: () => [392, 370, 349, 330].forEach((f, i) => tone({ f, t: 0.3, v: 0.12, d: i * 0.25, type: 'triangle' })),

  const root = new THREE.Group(), tilt = new THREE.Group(); root.add(tilt);
  const kart = buildKart(def), ch = buildCharacter(def);
  tilt.add(kart.root); ch.root.position.copy(kart.seat); kart.body.add(ch.root);

  blob.rotation.x = -Math.PI / 2; blob.scale.set(0.9, 1.35, 1); blob.renderOrder = 1; root.add(blob);

}

function rollItem(rank, n, mode, r = Math.random) {
  let table;
  if (mode === 'battle') table = BATTLE_ODDS;
  else table = ODDS[n <= 1 ? 0 : Math.round(rank / (n - 1) * 7)];
  const ent = Object.entries(table), tot = ent.reduce((a, [, w]) => a + w, 0); let x = r() * tot;
  for (const [k, w] of ent) { x -= w; if (x <= 0) return k; } return ent[0][0];
}

  if (n > 1) { if (n === 2) { const d = el('div', 'divider'); Object.assign(d.style, { left: 0, top: innerHeight / 2 - 2 + 'px', width: '100%', height: '4px' }); hudRoot.appendChild(d); } else { const a = el('div', 'divider'), b = el('div', 'divider'); Object.assign(a.style, { left: 0, top: innerHeight / 2 - 2 + 'px', width: '100%', height: '4px' }); Object.assign(b.style, { top: 0, left: innerWidth / 2 - 2 + 'px', height: '100%', width: '4px' }); hudRoot.append(a, b); } }
  if (race.world.kind === 'track' && n !== 4) {
    const S = n === 1 ? Math.min(innerWidth, innerHeight) * 0.26 : n === 3 ? Math.min(innerWidth, innerHeight) * 0.4 : Math.min(innerWidth, innerHeight) * 0.22;
    const r = n === 1 ? { x: innerWidth - S - 12, y: innerHeight * 0.36, w: S, h: S } : n === 2 ? { x: innerWidth - S - 8, y: innerHeight / 2 - S / 2, w: S, h: S } : { x: innerWidth * 0.75 - S / 2, y: innerHeight * 0.75 - S / 2, w: S, h: S };
    game.minimap = new Minimap(race, r);
  }
}
window.addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); if (composer) { composer.setSize(innerWidth, innerHeight); } layoutViews(); });

// ---------- pause / results ----------
function pauseMenu() {
  game.paused = true; Sound.stopEngines();
  menu(`<h2 class="mtitle">Paused</h2><div class="mlist">${btn('Resume', resume)}${btn('Restart', () => { game.paused = false; if (game.race.mode === 'gp') startGPRace(); else launch(game.lastOpts); })}${btn('Quit', quitToTitle)}</div>`, { back: resume });
}
function resume() { hideMenu(); game.paused = false; game.race.humans.forEach(h => h.engine = Sound.engine()); }
function quitToTitle() { endRace(); game.gp = null; game.state = 'menu'; Sound.stopEngines(); touchEl.classList.add('hidden'); titleScreen(); }
function finalOrder(race) {
  if (race.mode === 'battle') { const alive = race.racers.filter(k => !k.out).sort((a, b) => b.balloons - a.balloons); return [...alive, ...race.finishOrder.filter(k => k.out)]; }
  const rest = race.racers.filter(k => !k.finished).sort((a, b) => b.progress - a.progress);
  return [...race.finishOrder, ...rest];
}
function showResults() {
  const race = game.race; game.resultsShown = true; Sound.stopEngines();
  const order = finalOrder(race);
  // projected finish times for racers still on track
  const est = k => k.finished ? k.finishTime : race.raceT + Math.max(0, (race.laps + 1) * race.world.L - k.progress) / Math.max(10, race.ccStats.top * 0.9);
  if (race.mode === 'tt') {
    const k = race.humans[0], id = race.def.id + (race.mirror ? '-m' : ''), best = save.best[id], bestLap = Math.min(...k.lapTimes);
    let rec = '';
    if (!best || k.finishTime < best) { save.best[id] = k.finishTime; rec = '<div class="cartoon" style="color:#ff4b3e;font-size:28px">New record!</div>'; storeGhost(id, k.def.id, k.finishTime, new Float32Array(race.rec)); }
    if (!save.lap[id] || bestLap < save.lap[id]) save.lap[id] = bestLap;
    persist();
    menu(`<h2 class="mtitle">${race.def.name}</h2><div class="panel" style="text-align:center">${rec}<table class="res" style="margin:auto">${k.lapTimes.map((t, i) => `<tr><td>Lap ${i + 1}</td><td>${fmtTime(t)}</td></tr>`).join('')}<tr class="me"><td>Total</td><td>${fmtTime(k.finishTime)}</td></tr><tr><td>Record</td><td>${fmtTime(save.best[id])}</td></tr><tr><td>Best lap</td><td>${fmtTime(save.lap[id])}</td></tr></table></div><div class="mrow" style="margin-top:14px">${btn('Retry', () => launch(game.lastOpts))}${btn('Change course', () => { endRace(); trackMenu(); })}${btn('Quit', quitToTitle)}</div>`);
    return;
  }
  const rows = order.map((k, i) => `<tr class="${k.human ? 'me' : ''}"><td class="pos">${race.mode === 'battle' ? (i + 1) : ordinal(i + 1)}</td><td><span class="chip" style="background:${k.def.color}"></span>${k.def.name}${k.human && race.humans.length > 1 ? ' (P' + (k.pIdx + 1) + ')' : ''}</td><td>${race.mode === 'battle' ? '🎈'.repeat(Math.max(0, k.balloons)) : fmtTime(est(k))}</td>${race.mode === 'gp' ? `<td>+${POINTS[i]}</td>` : ''}</tr>`).join('');
  if (race.mode === 'gp') {
    const gp = game.gp, bestHuman = Math.min(...race.humans.map(h => order.indexOf(h)));
    if (bestHuman >= 4) {
      menu(`<h2 class="mtitle">${race.def.name}</h2><div class="panel"><table class="res">${rows}</table></div><div class="hint" style="font-size:18px">Finish 4th or better to score! Try again.</div><div class="mrow" style="margin-top:10px">${btn('Retry', startGPRace)}${btn('Quit', quitToTitle)}</div>`);
      return;
    }
    order.forEach((k, i) => gp.points[k.def.id] += POINTS[i]);
    gp.history.push(order.map(k => k.def.id));
    const stand = Object.entries(gp.points).sort((a, b) => b[1] - a[1]);
    gp.order = stand.map(s => s[0]).reverse().filter(id => !gp.chars.includes(id)).concat(gp.chars.slice()).reverse();
    gp.order = stand.map(s => s[0]);
    gp.round++;
    const last = gp.round >= 4;
    menu(`<h2 class="mtitle">${race.def.name}</h2><div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center"><div class="panel"><table class="res">${rows}</table></div><div class="panel"><div class="cartoon" style="font-size:22px;text-align:center">${CUPS[gp.cup].name} · Race ${gp.round}/4</div><table class="res">${stand.map(([id, p], i) => `<tr class="${gp.chars.includes(id) ? 'me' : ''}"><td class="pos">${ordinal(i + 1)}</td><td><span class="chip" style="background:${charById(id).color}"></span>${charById(id).name}</td><td>${p}</td></tr>`).join('')}</table></div></div>
      <div class="mrow" style="margin-top:12px">${btn(last ? 'Award ceremony' : 'Next race', last ? ceremony : startGPRace)}${btn('Quit', quitToTitle)}</div>`);
    return;
  }
  menu(`<h2 class="mtitle">${race.mode === 'battle' ? 'Battle over!' : race.def.name}</h2><div class="panel"><table class="res">${rows}</table></div><div class="mrow" style="margin-top:12px">${btn('Rematch', () => launch(game.lastOpts))}${btn(race.mode === 'battle' ? 'Change arena' : 'Change course', () => { endRace(); race.mode === 'battle' ? arenaMenu() : trackMenu(); })}${btn('Quit', quitToTitle)}</div>`);
}

// ---------- trophy ceremony ----------
function ceremony() {
  const gp = game.gp; endRace(); hideMenu();
  const stand = Object.entries(gp.points).sort((a, b) => b[1] - a[1]);
  const scene = new THREE.Scene(); scene.environment = ENV; scene.background = new THREE.Color(0x7fc4ff); scene.fog = new THREE.Fog(0xbfe6ff, 60, 300);
  scene.add(new THREE.HemisphereLight(0xdff2ff, 0x6a9a3a, 1.1)); const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(20, 40, 30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
  scene.add(Showroom.scene.children.find(o => o.isMesh && o.material && o.material.map && o.geometry.type === 'CircleGeometry').clone());
  mountainRing(scene, V3(), 160, THEMES.meadow, 5); clouds(scene, V3(), 120, 9);
  const cols = [0xffcc33, 0xd8d8e8, 0xd88a4a], heights = [4, 2.8, 1.8], xs = [0, -5.5, 5.5];
  const racers = [];
  for (let i = 0; i < 3; i++) {
    P(scene, G.box, mat(cols[i], { clear: true, metal: 0.4, rough: 0.3 }), xs[i], heights[i] / 2, 0, 5, heights[i], 5);
    const r = buildRacer(charById(stand[i][0])); r.root.position.set(xs[i], heights[i], 0); scene.add(r.root); racers.push(r);
  }
  const place = Math.min(...gp.chars.map(c => stand.findIndex(s => s[0] === c))) + 1;
  // the trophy
  const tr = new THREE.Group(); const tm = mat(place === 1 ? 0xffcc33 : place === 2 ? 0xd8d8e8 : 0xd88a4a, { metal: 1, rough: 0.18 });
  const prof = [[0, 0], [1.2, 0], [1.2, 0.3], [0.5, 0.5], [0.3, 1.4], [0.5, 1.6], [1.4, 2.0], [1.7, 3.2], [1.6, 3.3], [1.1, 2.2], [0, 2.1]].map(([x, y]) => new THREE.Vector2(x, y));
  const cup = new THREE.Mesh(new THREE.LatheGeometry(prof, 40), tm); cup.castShadow = true; tr.add(cup);
  for (const s of [-1, 1]) P(tr, G.torus, tm, s * 1.8, 2.6, 0, 0.6, 0.6, 0.6, 0, Math.PI / 2, 0);
  tr.position.set(0, heights[0] + 3.6, 1.2); tr.scale.setScalar(0.6); scene.add(tr);
  const glow = new Particles(scene, 1500, glowTex(), true);
  const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 2000);
  game.state = 'ceremony'; game.ceremony = { scene, cam, t: 0, glow, tr, racers };
  if (place <= 3) { const key = gp.cc + '-' + gp.cup; save.cups[key] = Math.min(save.cups[key] || 9, place); persist(); }
  Sound.playSong({ seed: 'ceremony-fanfare', bpm: 120, root: 62, scale: 'major', lead: 'square' }); sfx('finish');
  const won = place <= 3;
  setTimeout(() => menu(`<div style="margin-top:auto"></div><h2 class="mtitle">${CUPS[gp.cup].name} ${gp.cc === 'mirror' ? 'Mirror' : gp.cc + 'cc'}</h2><div class="panel" style="text-align:center;font-weight:900;font-size:20px">${won ? `${trophy(place)} You won the ${['gold', 'silver', 'bronze'][place - 1]} cup!` : `You finished ${ordinal(place)}. No trophy this time!`}<br><span style="font-size:15px">${stand.slice(0, 4).map(([id, p], i) => `${ordinal(i + 1)} ${charById(id).name} ${p}`).join(' · ')}</span>${cupsWon() && gp.cc === 150 && place === 1 ? '<br><span style="color:#ff4b3e">Mirror mode unlocked!</span>' : ''}</div><div class="mrow" style="margin-top:12px;margin-bottom:4vh">${btn('Continue', () => { game.ceremony = null; quitToTitle(); })}</div>`, { dim: false }), 2500);
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  menuNav();
  if (game.state === 'race' && game.race) {
    const race = game.race;
    if (!game.paused) {
      const steps = dt > 1 / 45 ? 2 : 1; for (let i = 0; i < steps; i++) race.update(dt / steps);
      if (race.humans.some(h => h.ctrl.s.pauseP) && !game.resultsShown) pauseMenu();
      if (race.phase === 'done' && race.phaseT > (race.mode === 'battle' ? 2.5 : 3.2) && !game.resultsShown) showResults();
      updateOwls(race, dt);
    }
    renderRace(race, dt);
    if (!game.paused) { game.huds.forEach(h => h.update(dt)); if (game.minimap) game.minimap.update(); }
  } else if (game.state === 'ceremony' && game.ceremony) {
    const c = game.ceremony; c.t += dt;
    const a = c.t * 0.25; c.cam.position.set(Math.sin(a) * 16, 6 + Math.sin(c.t * 0.5), Math.cos(a) * 16 + 4); c.cam.lookAt(0, 4, 0); c.cam.aspect = innerWidth / innerHeight; c.cam.updateProjectionMatrix();
    c.tr.rotation.y += dt; c.racers.forEach((r, i) => { r.ch.body.rotation.z = Math.sin(c.t * 5 + i) * 0.2; r.ch.head.rotation.y = Math.sin(c.t * 3 + i) * 0.4; });
    for (let i = 0; i < 6; i++) c.glow.emit((Math.random() - 0.5) * 30, 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 3, -4, (Math.random() - 0.5) * 3, 4, 0.5, [0xff5f6d, 0xffd23a, 0x47b3ff, 0x5ef08a, 0xc86bff][i % 5], { drag: 0.5 });
    c.glow.update(dt); c.glow.mat.uniforms.uVH.value = innerHeight;
    renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(c.scene, c.cam);
  } else {
    Showroom.update(dt); const c = Showroom.cam; c.aspect = innerWidth / innerHeight; c.updateProjectionMatrix();
    renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.setScissorTest(false);
    renderer.render(Showroom.scene, c);
  }
  pressedOnce.clear();
}
function updateOwls(race, dt) {
  race.humans.forEach((k, i) => {
    const o = race.owls[i]; if (!o || k.rescue) return;
    const u = o.userData;
    if (race.phase === 'intro' || race.phase === 'count' || (race.phase === 'race' && race.phaseT < 1.2)) {
      o.visible = race.phase !== 'intro' || race.phaseT > 2.4;
      const f = V3(Math.sin(k.yaw), 0, Math.cos(k.yaw)), r = V3(-f.z, 0, f.x);
      const up = race.phase === 'race' ? race.phaseT * 12 : 0;
      o.position.copy(k.pos).addScaledVector(f, 6).addScaledVector(r, -1.8).add(V3(0, 3.4 + up + Math.sin(race.time * 2) * 0.2, 0)); o.rotation.y = k.yaw + Math.PI;
      u.lights.visible = true; u.line.scale.y = 0.01; u.sign.visible = false;
      const lit = race.phase === 'count' ? Math.floor(race.phaseT) + 1 : race.phase === 'race' ? 4 : 0;
      u.bulbs.forEach((b, j) => b.material.color.setHex(lit === 4 ? 0x3cff6a : (2 - j) < lit ? 0xff3020 : 0x331111));
      if (race.world.lights) race.world.lights.forEach((b, j) => b.material.color.setHex(lit === 4 ? 0x3cff6a : j < lit ? 0xff3020 : 0x331111));
    } else if (k.wrongT > 1.2 && !k.finished) {
      o.visible = true; const f = V3(Math.sin(k.yaw), 0, Math.cos(k.yaw)); o.position.copy(k.pos).addScaledVector(f, 7).add(V3(0, 3, 0)); o.rotation.y = k.yaw + Math.PI; u.lights.visible = false; u.sign.visible = true; u.line.scale.y = 0.01;
    } else o.visible = false;
  });
}
function renderRace(race, dt) {
  const n = race.humans.length, rects = game.rects || viewRects(n), H = innerHeight;
  renderer.setScissorTest(n > 1);
  race.humans.forEach((k, i) => {
    const cc = game.cams[i], r = rects[i];
    if (!game.paused) cc.update(race, k, dt);
    cc.cam.aspect = r.w / r.h; cc.cam.updateProjectionMatrix();
    // sun & shadow box follow this player
    race.sun.position.copy(k.pos).add(V3(50, 80, 35)); race.sun.target.position.copy(k.pos);
    if (race.weather) { race.weather.position.set(k.pos.x, k.pos.y - 5, k.pos.z); if (i === 0 && !game.paused) { const p = race.weather.geometry.attributes.position; for (let j = 0; j < p.count; j++) { let y = p.getY(j) + (race.weather.userData.up ? 3 : -6) * dt; if (y < 0) y += 60; if (y > 60) y -= 60; p.setY(j, y); p.setX(j, p.getX(j) + Math.sin(race.time + j) * dt * 0.8); } p.needsUpdate = true; } }
    if (race.sky) race.sky.position.copy(cc.cam.position);
    if (race.stars) race.stars.position.copy(cc.cam.position);
    race.fx.mat.uniforms.uVH.value = r.h; race.glow.mat.uniforms.uVH.value = r.h;
    if (n === 1 && composer) { renderPass.scene = race.scene; renderPass.camera = cc.cam; composer.render(dt); }
    else { renderer.setViewport(r.x, H - r.y - r.h, r.w, r.h); renderer.setScissor(r.x, H - r.y - r.h, r.w, r.h); renderer.render(race.scene, cc.cam); }
  });
  if (n === 3) { renderer.setViewport(innerWidth / 2, 0, innerWidth / 2, H / 2); renderer.setScissor(innerWidth / 2, 0, innerWidth / 2, H / 2); renderer.setClearColor(0x20140c); renderer.clear(); }
  renderer.setScissorTest(false);
  if (race.world.screen) race.world.screen.material.color.setHSL((race.time * 0.1) % 1, 0.6, 0.6);
}

// ---------- boot ----------
(async () => {
  try { await document.fonts.ready; } catch (e) { }
  setupComposer();
  Showroom.update(0.016);
  game.faces = Showroom.portraits();
  renderer.setSize(innerWidth, innerHeight);
  $('#loading').classList.add('hidden');
  menu(`<h1 class="logo">Soapbox<br>Scramble <span class="n64">64</span><small>Cartoon soapbox kart racing</small></h1><div class="btn" data-any="1" id="startBtn" style="margin-top:22px;font-size:30px">Press Start</div><div class="hint">Keyboard · Gamepad · Touch</div>`, { dim: false });
  $('#startBtn')._act = () => { Sound.init(); titleScreen(); };
  requestAnimationFrame(frame);
})();
// debug hook for automated checks
window.__ss64 = { game, TRACKS, ARENAS, launch, Race, renderer, tick: (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) { last = performance.now() - dt * 1000; frame(performance.now()); } } };
</script>
