<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Parcour Hobbits</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8f0"/>
      <stop offset=".6" stop-color="#a6dcff"/>
      <stop offset="1" stop-color="#fff1cf"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad85a"/>
      <stop offset="1" stop-color="#3f9a2c"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8703e"/>
      <stop offset="1" stop-color="#6a3e1e"/>
    </linearGradient>
    <linearGradient id="qfront" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset=".5" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#e58a12"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05a40"/>
      <stop offset="1" stop-color="#a8261a"/>
    </linearGradient>
    <radialGradient id="skin" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffdcbc"/>
      <stop offset="1" stop-color="#e2a678"/>
    </radialGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff3c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2a1608" flood-opacity=".5"/>
    </filter>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="408" cy="104" r="120" fill="url(#sun)"/>
    <!-- rolling hills with a round green door -->
    <ellipse cx="90" cy="430" rx="230" ry="120" fill="#6cc04c"/>
    <ellipse cx="450" cy="440" rx="200" ry="110" fill="url(#hill)"/>
    <circle cx="420" cy="392" r="34" fill="#5a3a20"/>
    <circle cx="420" cy="392" r="28" fill="#2f8a3a"/>
    <circle cx="430" cy="396" r="4" fill="#ffd24a"/>
    <!-- 3D ground block -->
    <path d="M0 448 L512 448 L512 432 L0 432 Z" fill="#9ae86a"/>
    <rect y="448" width="512" height="64" fill="url(#soil)"/>
    <rect y="448" width="512" height="14" fill="#5ec23c"/>
    <!-- 3D question block: top and side faces, then the front -->
    <g filter="url(#shadow)">
      <path d="M312 148 L336 124 L456 124 L432 148 Z" fill="#ffe58a"/>
      <path d="M432 148 L456 124 L456 244 L432 268 Z" fill="#b8660a"/>
      <rect x="312" y="148" width="120" height="120" rx="14" fill="url(#qfront)" stroke="#8a4a08" stroke-width="5"/>
      <path d="M352 190 C352 166 392 162 396 184 C399 200 378 204 376 222 L376 230" fill="none" stroke="#fffbe8" stroke-width="15" stroke-linecap="round"/>
      <circle cx="376" cy="248" r="8" fill="#fffbe8"/>
      <circle cx="326" cy="162" r="5" fill="#a85a10"/><circle cx="418" cy="162" r="5" fill="#a85a10"/>
      <circle cx="326" cy="254" r="5" fill="#a85a10"/><circle cx="418" cy="254" r="5" fill="#a85a10"/>
    </g>
    <!-- the hobbit, jumping with a fist up -->
    <g filter="url(#shadow)" transform="translate(196 300) rotate(-8)">
      <!-- back leg and big hairy foot -->
      <path d="M-12 40 L-34 92" stroke="#e2a678" stroke-width="20" stroke-linecap="round"/>
      <ellipse cx="-40" cy="100" rx="30" ry="15" fill="#e2a678" transform="rotate(20 -40 100)"/>
      <path d="M-60 88 q8 -10 16 -2 q8 -10 16 -2 q8 -10 16 -2" fill="#7a3e1a"/>
      <!-- body: shirt, red waistcoat, blue breeches -->
      <rect x="-36" y="-50" width="72" height="80" rx="28" fill="#fff3e2"/>
      <path d="M-38 10 Q0 30 38 10 L36 44 Q0 58 -36 44 Z" fill="#3b5aa6"/>
      <path d="M-36 -46 L-6 -46 L4 -18 L30 -46 L40 18 Q0 36 -40 18 Z" fill="url(#vest)"/>
      <circle cx="10" cy="-8" r="5" fill="#ffd24a"/><circle cx="12" cy="8" r="5" fill="#ffd24a"/>
      <!-- front leg -->
      <path d="M14 40 L40 70" stroke="#f3c39b" stroke-width="20" stroke-linecap="round"/>
      <ellipse cx="54" cy="78" rx="32" ry="16" fill="url(#skin)" transform="rotate(-10 54 78)"/>
      <path d="M32 68 q8 -11 16 -2 q8 -11 16 -2 q8 -11 16 -2" fill="#7a3e1a"/>
      <!-- arms -->
      <path d="M-30 -36 L-68 -2" stroke="#fff3e2" stroke-width="20" stroke-linecap="round"/>
      <circle cx="-72" cy="2" r="13" fill="url(#skin)"/>
      <!-- head -->
      <path d="M-30 -92 Q-74 -128 -66 -150 Q-44 -118 -18 -104 Z" fill="#f3c39b"/>
      <circle cx="0" cy="-88" r="46" fill="url(#skin)"/>
      <ellipse cx="42" cy="-80" rx="12" ry="10" fill="#e8b088"/>
      <ellipse cx="22" cy="-66" rx="12" ry="7" fill="#ff8a7a" opacity=".45"/>
      <ellipse cx="22" cy="-98" rx="8" ry="11" fill="#fff"/>
      <circle cx="25" cy="-96" r="6" fill="#2a1a10"/>
      <circle cx="27" cy="-99" r="2" fill="#fff"/>
      <path d="M8 -64 Q22 -52 34 -64" fill="none" stroke="#5a2a14" stroke-width="5" stroke-linecap="round"/>
      <!-- curls -->
      <g fill="#7a3e1a">
        <circle cx="-36" cy="-100" r="20"/><circle cx="-26" cy="-126" r="21"/><circle cx="2" cy="-136" r="22"/>
        <circle cx="28" cy="-128" r="19"/><circle cx="40" cy="-112" r="13"/><circle cx="-44" cy="-76" r="16"/>
      </g>
      <g fill="#a8622e">
        <circle cx="-30" cy="-132" r="7"/><circle cx="-4" cy="-142" r="7"/><circle cx="22" cy="-134" r="6"/><circle cx="-42" cy="-106" r="6"/>
      </g>
      <!-- raised fist, in front -->
      <path d="M28 -38 L82 -96" stroke="#fff3e2" stroke-width="20" stroke-linecap="round"/>
      <circle cx="88" cy="-104" r="15" fill="url(#skin)"/>
    </g>
  </g>
</svg>
