<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Sandstorm Circuit</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c26a"/>
      <stop offset=".6" stop-color="#e08a35"/>
      <stop offset="1" stop-color="#b8602a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset=".5" stop-color="#e8b94a"/>
      <stop offset="1" stop-color="#8c5e1c"/>
    </linearGradient>
    <radialGradient id="exhaust">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#cfe0ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3a1a05" flood-opacity=".55"/>
    </filter>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="150" r="70" fill="#fff3cf" fill-opacity=".8"/>
    <path d="M0 250Q90 214 180 244T360 236T512 240V512H0Z" fill="#c9843c"/>
    <path d="M0 300Q120 262 250 296T512 280V512H0Z" fill="#a8652a"/>
    <!-- track running to the horizon -->
    <path d="M226 296H286L420 512H92Z" fill="#7a4520"/>
    <path d="M256 300V512" stroke="#f3d27a" stroke-width="8" stroke-dasharray="26 22"/>
    <g stroke="#fff3cf" stroke-opacity=".55" stroke-width="5" stroke-linecap="round">
      <path d="M24 196H96"/><path d="M420 186H496"/><path d="M40 360H110"/><path d="M410 380H490"/>
    </g>

    <g filter="url(#shadow)">
      <!-- control cables -->
      <path d="M150 268Q190 330 236 370M362 268Q322 330 276 370" fill="none" stroke="#2a1a10" stroke-width="7"/>
      <!-- engines, seen from behind -->
      <circle cx="140" cy="226" r="74" fill="url(#metal)" stroke="#5a3a12" stroke-width="5"/>
      <circle cx="372" cy="226" r="74" fill="url(#metal)" stroke="#5a3a12" stroke-width="5"/>
      <circle cx="140" cy="226" r="52" fill="#2a1a10"/>
      <circle cx="372" cy="226" r="52" fill="#2a1a10"/>
      <g fill="#c8202f">
        <path d="M80 182A74 74 0 0 1 200 182L190 190A62 62 0 0 0 90 190Z"/>
        <path d="M312 182A74 74 0 0 1 432 182L422 190A62 62 0 0 0 322 190Z"/>
      </g>
      <!-- cockpit pod -->
      <path d="M210 392Q210 352 256 350Q302 352 302 392L294 430H218Z" fill="url(#metal)" stroke="#5a3a12" stroke-width="5"/>
      <path d="M226 382Q228 362 256 361Q284 362 286 382Z" fill="#2c3a5a"/>
    </g>
    <!-- energy binder and afterburners -->
    <g filter="url(#glow)">
      <path d="M200 214L226 238L246 206L268 240L288 208L312 232" fill="none" stroke="#9fc0ff" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="140" cy="226" r="36" fill="url(#exhaust)"/>
      <circle cx="372" cy="226" r="36" fill="url(#exhaust)"/>
    </g>
  </g>
</svg>
